async function loadFindings() {
  const out = $("#fOut");
  if (!out) return;
  if (S.intel) {
    renderFindings(S.intel);
    renderNav();
    return;
  }
  out.innerHTML = `<div class="empty"><span class="spin"></span>
    Starting intelligence analysis…</div>`;
  try {
    const r = await post("intelligence/run", {
      containers: S.containers,
      owner: S.owner || "",
      tz: S.tz || 0,
    });
    let seq = 0;
    let lastMsg = "Running the rule set over every artifact…";
    const finish = (j) => {
      if (S.findingsTimer) clearInterval(S.findingsTimer);
      S.findingsTimer = null;
      if (j.status === "done" && j.result) {
        S.intel = j.result;
        renderFindings(S.intel);
        renderNav();
      } else {
        out.innerHTML = `<div class="note bad"><b>Findings could not be produced</b>
          ${esc(j.error || j.status)}</div>`;
      }
    };
    const poll = async () => {
      const j = await api(`job?id=${r.job_id}&since=${seq}`);
      j.log.forEach(line => {
        seq = line.seq;
        if (line.message) lastMsg = line.message;
      });
      out.innerHTML = `<div class="empty"><span class="spin"></span>
        ${esc(lastMsg)}</div>`;
      if (["done", "failed", "cancelled"].includes(j.status)) {
        finish(j);
        return true;
      }
      return false;
    };
    if (!(await poll())) {
      S.findingsTimer = setInterval(() => { poll(); }, 350);
    }
  } catch (e) {
    out.innerHTML = `<div class="note bad"><b>Findings could not be produced</b>
      ${esc(e.message)}</div>`;
  }
}

function renderFindings(intel) {
  const out = $("#fOut");
  const f = intel.findings;
  const sev = f.by_severity || {};
  const order = ["critical", "high", "medium", "low", "info"];

  let html = `<div class="sevbar">${order.filter(k => sev[k]).map(k => `
    <div class="sevbox"><div class="n" style="color:${
      k === "critical" ? "var(--danger)" : k === "high" ? "#e08b2f"
      : k === "medium" ? "var(--accent)" : "var(--fg3)"}">${sev[k]}</div>
      <div class="l">${esc(k)}</div></div>`).join("")}
    <div class="sevbox"><div class="n">${num(f.artifacts_analysed)}</div>
      <div class="l">artifacts</div></div>
    <div class="sevbox"><div class="n">${f.rules_run}</div>
      <div class="l">rules run</div></div>
  </div>`;

  if (!f.count) {
    html += `<div class="note"><b>No rule produced a finding</b>
      This is not a statement that nothing of interest is present — only that
      the automated rules did not fire. Continue in the Analyse view.</div>`;
  }
  if (!f.artifacts_analysed) {
    html += `<div class="note bad"><b>No decoded artifacts in selected container(s)</b>
      Intelligence needs a completed extraction with decode. If extraction logs show
      <code>unexpected: 'NoneType' object has no attribute 'strip'</code>, restart
      ARGUS, re-run extraction (Comprehensive or Filesystem with USB debugging on),
      then open <b>one</b> sealed container — not every failed attempt.</div>`;
  }

  const hs = intel.hashsets || {};
  if (hs.performed || hs.known_bad_count || hs.known_good_count) {
    const summary = hs.summary || {};
    html += `<h2>Hash-set screening</h2>
      <div class="grid" style="margin-bottom:12px">
        <div class="card"><h3>Screened</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${num(summary.screened || 0)}</div></div>
        <div class="card"><h3>Known-bad hits</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono);color:var(--danger)">
            ${num(hs.known_bad_count || 0)}</div></div>
        <div class="card"><h3>Known-good suppressed</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${num(hs.known_good_count || 0)}</div></div>
      </div>`;
    if ((hs.known_bad || []).length) {
      html += `<table><thead><tr><th>File</th><th>Set</th><th>SHA-256</th></tr></thead><tbody>
        ${hs.known_bad.slice(0, 15).map(h => `<tr>
          <td>${esc(h.filename || h.artifact_id || "—")}</td>
          <td>${esc(h.set_name || "")}</td>
          <td class="mono">${esc((h.sha256 || "").slice(0, 16))}…</td></tr>`).join("")}
        </tbody></table>`;
    }
  }

  if (!f.count && !(hs.known_bad_count || hs.performed)) {
    out.innerHTML = html;
    return;
  }
  if (!f.count) {
    out.innerHTML = html;
    return;
  }

  html += f.findings.map(x => `
    <div class="finding ${esc(x.severity)}">
      <div class="fhead">
        <span class="sevtag ${esc(x.severity)}">${esc(x.severity.toUpperCase())}</span>
        <h3>${esc(x.title)}</h3>
        <span class="mono" style="color:var(--fg3)">conf ${x.confidence}</span>
      </div>
      <div class="detail">${esc(x.detail)}</div>
      ${x.why_it_matters ? `<div class="why"><b>Why it matters:</b>
        ${esc(x.why_it_matters)}</div>` : ""}
      ${(x.evidence || []).length ? `<ul class="fev">${
        x.evidence.slice(0, 4).map(v => `<li>${esc(String(v).slice(0, 200))}</li>`)
        .join("")}</ul>` : ""}
      ${(x.parties || []).length ? `<div class="taglist">${
        x.parties.slice(0, 8).map(p => `<span class="pill">${esc(p)}</span>`)
        .join("")}</div>` : ""}
      <div class="fmeta">
        <span>rule ${esc(x.rule_id)}</span>
        <span>${(x.artifact_ids || []).length} artifact(s) cited</span>
        ${x.first_seen_iso ? `<span>${esc(x.first_seen_iso.slice(0, 19))} →
          ${esc((x.last_seen_iso || "").slice(0, 19))}</span>` : ""}
        ${(x.artifact_ids || []).length ?
          `<a href="#" data-ids="${esc((x.artifact_ids || []).slice(0,1).join(''))}"
             class="openq" style="color:var(--accent)">open in analysis →</a>` : ""}
      </div>
      ${x.caveat ? `<div class="caveat"><b>Caveat:</b> ${esc(x.caveat)}</div>` : ""}
    </div>`).join("");

  // Entities
  const ents = intel.entities || {};
  const high = ents.high_value || [];
  if (high.length) {
    html += `<h2>High-value entities extracted from content</h2>
      <p class="lede" style="margin-bottom:10px">Checksum-validated where the
        format allows. A valid checksum proves the string is well-formed — not
        that it belongs to the device owner or was ever used.</p>
      <table><thead><tr><th>Type</th><th>Value</th><th>Seen</th>
        <th>Validation</th><th>Applications</th></tr></thead><tbody>
      ${high.slice(0, 30).map(h => `<tr>
        <td>${esc(h.label)}</td>
        <td class="mono">${esc(String(h.value).slice(0, 56))}</td>
        <td>${h.count}</td>
        <td>${h.validated ? '<span class="pill ok">checksum verified</span>'
                          : '<span class="pill">format only</span>'}</td>
        <td>${esc((h.apps || []).slice(0, 3).join(", "))}</td></tr>`).join("")}
      </tbody></table>`;
  }
  if (ents.by_kind && Object.keys(ents.by_kind).length) {
    html += `<div class="taglist" style="margin-top:10px">${
      Object.entries(ents.by_kind).map(([k, v]) =>
        `<span class="pill">${esc(k)} ${v}</span>`).join("")}</div>`;
  }

  // Correlation
  const corr = intel.correlation || {};
  if (corr.shared_party_count) {
    html += `<h2>Cross-exhibit correlation</h2>
      <div class="grid" style="margin-bottom:12px">
        <div class="card"><h3>Shared parties</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${corr.shared_party_count}</div></div>
        <div class="card"><h3>Byte-identical files</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${corr.shared_media_count || 0}</div></div>
        <div class="card"><h3>Shared locations</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${corr.shared_location_count || 0}</div></div>
      </div>
      <table><thead><tr><th>Party</th><th>Exhibits</th><th>Artifacts</th>
        <th>Deleted on</th></tr></thead><tbody>
      ${(corr.shared_parties || []).slice(0, 20).map(p => `<tr>
        <td><b>${esc(p.best_label)}</b></td>
        <td>${esc(Object.keys(p.exhibits).join(", "))}</td>
        <td>${num(Object.values(p.exhibits).reduce((a, b) => a + b, 0))}</td>
        <td>${p.deleted_on.length
              ? `<span class="pill warn">${esc(p.deleted_on.join(", "))}</span>`
              : "—"}</td></tr>`).join("")}
      </tbody></table>
      <div class="note">${esc(corr.note || "")}</div>`;
  }

  // Communities
  const comm = intel.communities || {};
  if (comm.count) {
    html += `<h2>Community structure</h2>
      <div class="note ${comm.structure_is_meaningful ? "ok" : ""}">
        <b>Modularity ${comm.modularity}</b>${esc(comm.interpretation)}</div>`;
  }

  // Conversations
  const conv = intel.conversations || {};
  if (conv.conversation_count) {
    html += `<h2>Conversation threads</h2>
      <div class="grid" style="margin-bottom:12px">
        <div class="card"><h3>Threads</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${conv.conversation_count}</div></div>
        <div class="card"><h3>With deleted content</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${conv.threads_with_deleted_content || 0}</div></div>
      </div>`;
    if ((conv.threads || []).length) {
      html += `<table><thead><tr><th>Correspondent</th><th>Messages</th>
        <th>Deleted</th><th>Last activity</th></tr></thead><tbody>
        ${conv.threads.slice(0, 15).map(t => `<tr>
          <td><b>${esc(t.label || t.correspondent || "—")}</b></td>
          <td>${num(t.message_count)}</td>
          <td>${t.deleted_count ? `<span class="pill warn">${t.deleted_count}</span>` : "—"}</td>
          <td class="mono">${esc((t.last_message_at || "").slice(0, 19))}</td></tr>`).join("")}
        </tbody></table>`;
    }
  }

  // Attribution / fusion
  const fusion = intel.fusion || {};
  if (fusion.events) {
    const by = fusion.by_attribution || {};
    html += `<h2>Device attribution</h2>
      <div class="grid" style="margin-bottom:12px">
        <div class="card"><h3>Attributed</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${by.attributed || 0}</div></div>
        <div class="card"><h3>Probable</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${by.probable || 0}</div></div>
        <div class="card"><h3>Unknown</h3>
          <div class="stat" style="font-size:26px;font-family:var(--mono)">
            ${by.unknown || fusion.unknown || 0}</div></div>
      </div>
      <div class="note">${esc(fusion.note || fusion.coverage_note || "")}</div>`;
  }

  html += `<div class="actions">
    <button class="btn primary" id="fToReport">Include these in a report →</button>
    <button class="btn" id="fToAnalyse">Open the analysis view</button></div>`;

  out.innerHTML = html;
  if ($("#fToReport")) $("#fToReport").onclick = () => {
    S.view = "report"; renderNav(); route(); };
  if ($("#fToAnalyse")) $("#fToAnalyse").onclick = () => {
    S.view = "analyse"; renderNav(); route(); };
  out.querySelectorAll("a.openq").forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const id = a.dataset.ids || "";
    S.view = "analyse"; renderNav();
    openAnalysis({ artifact: id });
  });
}

/* ═══════════════════════ 6 · REPORT ═══════════════════════ */
async function viewReport(m) {
  await refreshCase();
  const ex = S.caseOverview.extractions || [];
  const caps = S.env.capabilities;
  let savedOperator = "";
  try { savedOperator = sessionStorage.getItem("argus_operator") || ""; } catch (_) {}
  const defaultExaminer = savedOperator || S.caseOverview.investigator || "";
  const fmt = (id, label, need) => {
    const ok = !need || caps[need]?.available;
    return `<label class="check" ${ok ? "" : 'style="opacity:.45"'}>
      <input type="checkbox" class="fmt" value="${id}" ${
        ok ? (id === "html" ? "checked" : "") : "disabled"}>
      <span>${esc(label)}${ok ? "" :
        `<small>Unavailable — ${esc(caps[need].install)}</small>`}</span></label>`;
  };

  m.innerHTML = `<div class="pane">
    <h1>Report</h1>
    <div class="lede">Every format leads with the integrity statement, before
      any finding. Records recovered from deleted space are visually
      distinguished throughout, so a reader can never mistake carved material
      for something that was live on the handset.
      <span class="mono" style="display:block;margin-top:6px;color:var(--fg3)">
      Lab manual §6.8, Step 21</span></div>

    <h2>Extractions to include</h2>
    <div class="cards" id="rCards">${ex.map(x => `
      <div class="card pick ${S.containers.includes(x.path) ? "sel" : ""}"
           data-path="${esc(x.path)}">
        <h3>${esc(x.exhibit_id)}</h3>
        <dl class="kv"><dt>Device</dt><dd>${esc(x.device || "—")}</dd>
          <dt>Artifacts</dt><dd>${num(x.artifacts)}</dd></dl></div>`).join("")}</div>

    <h2>Scope</h2>
    <div class="grid">
      <div class="field"><label>Include</label>
        <select id="rScope">
          <option value="all">All artifacts</option>
          <option value="filtered">Filtered by query…</option>
        </select></div>
      <div class="field" id="rQueryField" style="display:none">
        <label>AQL filter</label>
        <input id="rQuery" placeholder='category:Messages AND deleted:true'
          spellcheck="false">
        <span class="help">Same query language as the analysis view.</span></div>
    </div>

    <h2>Output formats</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px">
      ${fmt("html", "HTML — self-contained, prints cleanly", null)}
      ${fmt("pdf", "PDF — paginated, court-ready", "pdf")}
      ${fmt("xlsx", "Excel — one sheet per category", "xlsx")}
      ${fmt("docx", "Word — editable narrative", "docx")}
      ${fmt("xml", "XML — structured exchange", null)}
      ${fmt("json", "JSON — full fidelity", null)}
      ${fmt("csv", "CSV — flat artifact list", null)}
    </div>

    <h2>Report details</h2>
    <div class="grid">
      <div class="field"><label>Title</label>
        <input id="rTitle" value="Mobile Device Forensic Examination Report"></div>
      <div class="field"><label>Examiner</label>
        <input id="rExaminer" value="${esc(defaultExaminer)}"></div>
      <div class="field"><label>Organisation</label>
        <input id="rOrg" value="${esc(S.caseOverview.organisation || "")}"></div>
      <div class="field"><label>Reference</label>
        <input id="rRef" placeholder="e.g. FIR 114/2026"></div>
    </div>
    <div class="field" style="margin-top:14px"><label>Conclusion</label>
      <textarea id="rConc" placeholder="Your findings and conclusion"></textarea></div>
    <div style="margin-top:12px">
      <label class="check"><input type="checkbox" id="rDeleted" checked>
        <span>Include records recovered from deleted space</span></label>
      <label class="check"><input type="checkbox" id="rGraph" checked>
        <span>Include communication analysis</span></label>
      <label class="check"><input type="checkbox" id="rIntel" checked>
        <span>Include investigative findings
          <small>Ranked leads with citations and caveats, placed before the
          artifact tables.</small></span></label>
      <label class="check"><input type="checkbox" id="rLog">
        <span>Append the extraction log</span></label>
      <label class="check"><input type="checkbox" id="rAudit">
        <span>Append the chain-of-custody log</span></label>
    </div>

    <div class="field" style="margin-top:14px"><label>Save to</label>
      <div class="inline"><input id="rOut" spellcheck="false"
        value="${esc(S.env.workspace + (S.env.workspace.includes("\\") ? "\\reports" : "/reports"))}">
        <button class="btn" id="rBrowse">Browse…</button></div></div>

    <h2>Court readiness</h2>
    <div class="lede" style="margin-bottom:12px">Independent integrity artifacts
      that can be verified without ARGUS — validation against known-answer tests
      and a self-contained evidence certificate.</div>
    <div class="actions" style="margin-top:0">
      <button class="btn" id="rValidate">Run validation harness</button>
      <button class="btn" id="rCert">Issue evidence certificate</button>
      <button class="btn primary" id="rBundle">Generate court bundle</button>
    </div>
    <div id="rCourt"></div>

    <div class="actions">
      <button class="btn primary" id="rGo">Generate report</button>
      <span id="rMsg" class="mono"></span></div>
    <div id="rRun"></div>
  </div>`;

  m.querySelectorAll("#rCards .card").forEach(card => {
    card.onclick = () => {
      const p = card.dataset.path;
      S.containers = S.containers.includes(p)
        ? S.containers.filter(x => x !== p) : [...S.containers, p];
      m.querySelectorAll("#rCards .card").forEach(c =>
        c.classList.toggle("sel", S.containers.includes(c.dataset.path)));
    };
  });
  $("#rScope").onchange = e =>
    $("#rQueryField").style.display = e.target.value === "filtered" ? "" : "none";
  $("#rBrowse").onclick = () => openBrowser({
    title: "Choose where to save the report", start: $("#rOut").value,
    onPick: p => $("#rOut").value = p });

  $("#rValidate").onclick = async () => {
    $("#rCourt").innerHTML = `<div class="note"><span class="spin"></span>
      Running validation harness…</div>`;
    try {
      const r = await post("validate", { out_dir: $("#rOut").value.trim() });
      watchJob(r.job_id, "rCourt", j => {
        if (j.status === "done") {
          const d = j.result || {};
          const s = d.summary || {};
          $("#rCourt").innerHTML = `<div class="note ok"><b>Validation complete</b>
            ${s.tests_passed || 0}/${s.tests_run || 0} tests · recall ${
            s.overall_recall || "—"} · precision ${s.overall_precision || "—"}
            ${d.report_path ? `<div class="mono" style="margin-top:6px">${
              esc(d.report_path)}</div>` : ""}</div>`;
        }
      });
    } catch (e) {
      $("#rCourt").innerHTML = `<div class="note bad">${esc(e.message)}</div>`;
    }
  };
  $("#rCert").onclick = async () => {
    if (!S.containers.length) {
      toast("Select at least one extraction.", { type: "warn" });
      return;
    }
    $("#rCourt").innerHTML = `<div class="note"><span class="spin"></span>
      Building evidence certificate…</div>`;
    try {
      const r = await post("certificate", {
        containers: S.containers,
        out_dir: $("#rOut").value.trim(),
        examiner: $("#rExaminer").value.trim(),
        seal: true });
      watchJob(r.job_id, "rCourt", j => {
        if (j.status === "done") {
          const d = j.result || {};
          $("#rCourt").innerHTML = `<div class="note ok"><b>Certificate issued</b>
            ${d.path ? `<div class="mono" style="margin-top:6px">${
              esc(d.path)}</div>` : ""}
            ${d.digest ? `<div style="margin-top:6px">Digest: <code>${
              esc(String(d.digest).slice(0, 32))}…</code></div>` : ""}
            ${d.all_verified === false ? `<div class="note bad" style="margin-top:8px">
              Verification failures were recorded on the certificate.</div>` : ""}
          </div>`;
        }
      });
    } catch (e) {
      $("#rCourt").innerHTML = `<div class="note bad">${esc(e.message)}</div>`;
    }
  };
  $("#rBundle").onclick = async () => {
    if (!S.containers.length) {
      toast("Select at least one extraction.", { type: "warn" });
      return;
    }
    $("#rCourt").innerHTML = `<div class="note"><span class="spin"></span>
      Building court disclosure bundle…</div>`;
    try {
      const r = await post("bundle", {
        containers: S.containers,
        out_dir: $("#rOut").value.trim(),
        examiner: $("#rExaminer").value.trim(),
        organisation: $("#rOrg").value.trim(),
        reference: $("#rRef").value.trim(),
        conclusion: $("#rConc").value.trim(),
        owner: S.owner });
      watchJob(r.job_id, "rCourt", j => {
        if (j.status === "done") {
          const d = j.result || {};
          $("#rCourt").innerHTML = `<div class="note ok"><b>Court bundle ready</b>
            <div class="mono" style="margin-top:6px">${esc(d.bundle_dir || "")}</div>
            <div style="margin-top:6px">${d.file_count || 0} file(s) · verified: ${
              d.all_verified ? "yes" : "with warnings"}</div>
            ${d.manifest ? `<div class="mono" style="margin-top:4px">${esc(d.manifest)}</div>` : ""}
          </div>`;
        }
      });
    } catch (e) {
      $("#rCourt").innerHTML = `<div class="note bad">${esc(e.message)}</div>`;
    }
  };

  $("#rGo").onclick = async () => {
    const formats = [...m.querySelectorAll(".fmt:checked")].map(c => c.value);
    $("#rMsg").textContent = "";
    if (!S.containers.length) { $("#rMsg").innerHTML =
      `<span style="color:var(--danger)">Select at least one extraction.</span>`; return; }
    if (!formats.length) { $("#rMsg").innerHTML =
      `<span style="color:var(--danger)">Select at least one format.</span>`; return; }
    $("#rGo").disabled = true;
    try {
      const r = await post("report", {
        containers: S.containers, out_dir: $("#rOut").value.trim(),
        formats, scope: $("#rScope").value, query: $("#rQuery")?.value || "",
        title: $("#rTitle").value, examiner: $("#rExaminer").value,
        organisation: $("#rOrg").value, reference: $("#rRef").value,
        conclusion: $("#rConc").value,
        include_deleted: $("#rDeleted").checked,
        include_graph: $("#rGraph").checked,
        include_intelligence: $("#rIntel").checked,
        owner: S.owner,
        include_log: $("#rLog").checked, include_audit: $("#rAudit").checked });
      watchJob(r.job_id, "rRun", () => { $("#rGo").disabled = false; });
    } catch (e) {
      $("#rMsg").innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
      $("#rGo").disabled = false;
    }
  };
  setStat("Configure and generate the forensic report");
}

/* ═══════════════════════ extraction save / export ═══════════════════════ */
function containerZipName(containerPath) {
  const base = (containerPath || "").split(/[\\/]/).pop() || "extraction";
  return base.endsWith(".afc") ? `${base}.zip` : `${base}.afc.zip`;
}

async function openContainerFolder(containerPath) {
  if (!containerPath) return;
  try {
    await post("shell/open", { path: containerPath });
  } catch (e) { toast(e.message, { type: "bad" }); }
}

function saveContainerZip(containerPath) {
  if (!containerPath) return;
  const zipName = containerZipName(containerPath);
  const parent = (containerPath || "").replace(/[\\/][^\\/]+$/, "") || S.env?.workspace || "";
  openBrowser({
    title: "Save extraction as ZIP — choose folder",
    start: parent,
    onPick: async (dir) => {
      const sep = dir.includes("\\") ? "\\" : "/";
      const dest = /\.zip$/i.test(dir)
        ? dir : `${dir.replace(/[\\/]$/, "")}${sep}${zipName}`;
      try {
        toast("Creating ZIP archive…", { type: "info", duration: 12000 });
        const r = await post("container/export", { container: containerPath, dest });
        toast(`Saved ${human(r.size)} → ${r.path}`, { type: "ok", duration: 10000 });
      } catch (e) { toast(e.message, { type: "bad" }); }
    },
  });
}

/* ═══════════════════════ folder browser ═══════════════════════ */
let fsState = { path: "", onPick: null, allowFiles: false };

function openBrowser({ title, start, onPick, allowFiles }) {
  fsState = { path: start || "", onPick, allowFiles: !!allowFiles };
  $("#modalTitle").textContent = title || "Choose a folder";
  $("#modal").classList.add("open");
  loadDir(start || "");
}
function closeModal() { $("#modal").classList.remove("open"); }
$("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
$("#fsGo").onclick = () => loadDir($("#fsPath").value);
$("#fsPath").onkeydown = e => { if (e.key === "Enter") loadDir($("#fsPath").value); };
$("#fsPick").onclick = () => {
  if (fsState.onPick) fsState.onPick(fsState.path);
  closeModal();
};

async function loadDir(path) {
  const body = $("#fsBody");
  body.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try {
    const r = await api("browse?path=" + encodeURIComponent(path || ""));
    fsState.path = r.path;
    $("#fsPath").value = r.path;
    $("#fsSel").textContent = r.path || "Choose a location";
    $("#fsUp").onclick = () => loadDir(r.parent || "");
    $("#fsUp").disabled = !r.parent;

    body.innerHTML = "";
    if (r.is_root_list || !r.path) {
      r.roots.forEach(root => {
        const row = el("div", "fsrow dir");
        row.innerHTML = `<span class="ic">▸</span>
          <span class="nm">${esc(root)}</span>`;
        row.onclick = () => loadDir(root);
        body.appendChild(row);
      });
      return;
    }
    r.dirs.forEach(d => {
      const row = el("div", "fsrow dir " + (d.kind || ""));
      const icon = d.kind === "case" ? "▣" : d.kind === "container" ? "▤"
                 : d.kind === "ios-backup" ? "▤" : "▸";
      row.innerHTML = `<span class="ic">${icon}</span>
        <span class="nm">${esc(d.name)}</span>
        ${d.kind ? `<span class="pill">${esc(d.kind)}</span>` : ""}`;
      row.onclick = () => loadDir(d.path);
      if (fsState.allowFiles && d.kind) {
        row.ondblclick = () => { fsState.onPick(d.path); closeModal(); };
      }
      body.appendChild(row);
    });
    if (fsState.allowFiles) {
      r.files.forEach(f => {
        const icon = f.kind === "backup" ? "▤"
                   : f.kind === "msab-xry" ? "◆"
                   : f.kind === "cellebrite" ? "◆"
                   : f.kind === "container" ? "▤"
                   : f.kind === "archive" ? "▣" : "·";
        const row = el("div", "fsrow");
        row.innerHTML = `<span class="ic">${icon}</span>
          <span class="nm">${esc(f.name)}</span>
          ${f.kind && f.kind !== "file"
            ? `<span class="pill">${esc(f.kind)}</span>` : ""}
          <span class="sz">${human(f.size)}</span>`;
        row.onclick = () => { fsState.onPick(f.path); closeModal(); };
        body.appendChild(row);
      });
    }
    if (!r.dirs.length && !(fsState.allowFiles && r.files.length)) {
      body.innerHTML = `<div class="empty">This folder is empty.</div>`;
    }
  } catch (e) {
    body.innerHTML = `<div class="pane"><div class="note bad">${
      esc(e.message)}</div></div>`;
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});
