function methodsForLock(lockState) {
  if (S.device?.transport === "usbmux" || /iphone|ipad|ios/i.test(S.device?.os_family || S.device?.name || "")) {
    return ["backup", "comprehensive", "turbo", "import"];
  }
  if (S.device?.transport === "mtp") {
    const adbAlso = (S.devices || []).some(d => d.transport === "adb");
    return adbAlso
      ? ["mtp", "comprehensive", "logical", "filesystem", "import"]
      : ["mtp"];
  }
  const profile = S.deviceProfile;
  const base = ["import"];
  if (!profile) return devMethodsFallback();
  const row = (profile.capability_overview || [])
    .find(r => r.lock_state === lockState);
  const live = (row?.methods || []).map(m => m.method).filter(m => m !== "import");
  if (live.some(m => m === "logical" || m === "filesystem")) {
    live.push("comprehensive", "turbo");
  }
  if (live.includes("logical") && navigator.platform.toLowerCase().includes("win")) {
    live.push("mtp");
  }
  return [...new Set([...base, ...live])];

  function devMethodsFallback() {
    if (S.device?.transport === "mtp") {
      const adbAlso = (S.devices || []).some(d => d.transport === "adb");
      return adbAlso
        ? ["import", "comprehensive", "logical", "filesystem", "mtp", "turbo", "backup"]
        : ["mtp"];
    }
    const methods = S.device
      ? ["import", "comprehensive", "logical", "filesystem", "turbo", "backup"]
      : ["import"];
    if (S.device && navigator.platform.toLowerCase().includes("win")) {
      methods.push("mtp");
    }
    return methods;
  }
}

function methodMeta(methodId, lockState) {
  const profile = S.deviceProfile;
  if (!profile || methodId === "import") return { enabled: true, note: "" };
  if (methodId === "comprehensive") {
    const logical = methodMetaInner("logical", lockState);
    const fs = methodMetaInner("filesystem", lockState);
    return {
      enabled: logical.enabled || fs.enabled,
      note: logical.enabled || fs.enabled
        ? "Recommended — 4-pass god-level: logical, app DBs, filesystem, dumpsys/Vivo exports."
        : "Requires logical or filesystem support for this device.",
      risk: "medium",
      label: "Comprehensive (god-level)",
    };
  }
  if (methodId === "turbo") {
    const ios = S.device?.transport === "usbmux"
      || /iphone|ipad|ios/i.test(S.device?.os_family || S.device?.name || "");
    if (ios) {
      return {
        enabled: true,
        note: "iOS turbo — logical backup (or Camera Roll copy if backup tools are missing).",
        risk: "low",
        label: "Turbo (fastest)",
      };
    }
    const fs = methodMetaInner("filesystem", lockState);
    return {
      enabled: fs.enabled,
      note: fs.enabled
        ? "God-mode speed — parallel ADB pulls, 24+ decode workers, fast seal. Best for large intake days."
        : "Requires filesystem support for this device.",
      risk: "low",
      label: "Turbo (fastest)",
    };
  }
  if (methodId === "mtp") {
    const isWin = navigator.platform.toLowerCase().includes("win");
    const mtpConnected = S.device?.transport === "mtp";
    const logical = methodMetaInner("logical", lockState);
    return {
      enabled: isWin && (mtpConnected || logical.enabled || !profile),
      note: mtpConnected
        ? "Handset detected in file-transfer mode — shared storage copy with hashing."
        : logical.enabled
          ? "For handsets in file-transfer mode without USB debugging. Shared storage only."
          : isWin
            ? "Connect a handset in file-transfer (MTP) mode, or pick a catalogued profile."
            : "MTP requires Windows.",
      risk: "low",
      label: "MTP (file transfer)",
    };
  }
  return methodMetaInner(methodId, lockState);

  function methodMetaInner(id, lock) {
    const row = (profile.capability_overview || [])
      .find(r => r.lock_state === lock);
    const hit = (row?.methods || []).find(m => m.method === id);
    return {
      enabled: !!hit,
      note: hit?.note || (hit ? "" : "Not supported for this device in the selected lock state."),
      risk: hit?.risk || "",
      label: hit?.label || id,
    };
  }
}

/* ═══════════════════════ 4 · EXTRACT ═══════════════════════ */
async function viewExtract(m) {
  if (!S.casePath) {
    m.innerHTML = `<div class="pane"><div class="note warn"><b>Open a case first</b>
      Go to <b>Case</b> and create or open a case before extracting.</div></div>`;
    return;
  }
  try {
    await refreshCase();
  } catch (e) {
    m.innerHTML = `<div class="pane"><div class="note bad"><b>Could not load case</b>
      ${esc(e.message)}</div></div>`;
    return;
  }
  if (!S.caseOverview) {
    m.innerHTML = `<div class="pane"><div class="note bad"><b>Case not loaded</b>
      Return to <b>Case</b> and open your case again.</div></div>`;
    return;
  }
  if (!hasExhibits() || !S.exhibitId) {
    S.view = "exhibit";
    toast("Register and select an exhibit before extraction (Step 3).",
      { type: "warn" });
    return route();
  }
  if (!S.device) {
    try {
      const r = await api("devices?deep=0");
      S.connectedDevices = r.devices || [];
      const ready = S.connectedDevices.filter(d => d.raw?.ready !== false);
      if (ready.length) {
        S.device = ready.find(d => d.transport === "mtp") || ready[0];
      }
    } catch (_) {}
  }
  if (!S.exhibitId && (S.caseOverview?.exhibits || []).length) {
    S.exhibitId = S.caseOverview.exhibits[0].exhibit_id;
  }
  const cats = S.env?.categories || [];
  const dev = S.device;
  if (dev?.transport === "mtp") S.source = null;
  const profileName = S.deviceProfile?.device?.name || "";
  const lockState = () => $("#eLock")?.value || "unlocked";
  let savedOperator = "";
  try { savedOperator = sessionStorage.getItem("argus_operator") || ""; } catch (_) {}
  const defaultOperator = savedOperator || S.caseOverview.investigator || "";

  m.innerHTML = `<div class="pane">
    <h1>Extraction</h1>
    <div class="lede">Choose the action, the time span and the artifact
      categories, then record who is performing the extraction. The operator
      and exhibit ID are required — they are the chain-of-custody record.
      <span class="mono" style="display:block;margin-top:6px;color:var(--fg3)">
      Lab manual §5.5–5.9, Steps 8–13</span></div>

    <div id="resumeBlock"></div>
    <div id="preflightBlock" class="note" style="margin-bottom:12px;display:none"></div>
    <div id="mtpTip" style="display:none"></div>

    <h2>Extraction action <span style="font-weight:400;color:var(--fg3)">— Step 8</span></h2>
    <div class="cards" id="methodCards"></div>
    <div id="methodNote"></div>

    <div id="sourceBlock"></div>

    <h2>Time span <span style="font-weight:400;color:var(--fg3)">— Step 9</span></h2>
    <div class="grid">
      <div class="field"><label>Restrict to</label>
        <select id="eSpan">
          <option value="all">All data (nothing excluded by timestamp)</option>
          <option value="365d">Last 365 days</option>
          <option value="30d">Last 30 days</option>
          <option value="7d">Last 7 days</option>
          <option value="24h">Last 24 hours</option>
          <option value="custom">Custom range…</option>
        </select></div>
      <div class="field" id="customSpan" style="display:none">
        <label>Range (YYYY-MM-DD..YYYY-MM-DD)</label>
        <input id="eSpanCustom" placeholder="2026-01-01..2026-03-31" spellcheck="false"></div>
    </div>

    <h2>Artifact categories <span style="font-weight:400;color:var(--fg3)">— Step 10</span></h2>
    <div class="inline" style="margin-bottom:8px">
      <button class="btn sm" id="catAll">Select all</button>
      <button class="btn sm" id="catNone">Select none</button>
      <span class="help" style="color:var(--fg3)">Excluding a category speeds up
        the extraction when you only need specific data.</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px">
      ${cats.map(c => `<label class="check">
        <input type="checkbox" class="cat" value="${esc(c)}" checked>
        <span>${esc(c)}</span></label>`).join("")}
    </div>

    <h2>File details <span style="font-weight:400;color:var(--fg3)">— Step 11</span></h2>
    <div class="grid">
      <div class="field"><label>Operator <span class="req">*</span></label>
        <input id="eOp" value="${esc(defaultOperator)}"
          placeholder="Who is performing this extraction"></div>
      <div class="field"><label>Exhibit</label>
        <select id="eExhibit">${(S.caseOverview.exhibits || []).map(e =>
          `<option ${e.exhibit_id === S.exhibitId ? "selected" : ""}
            value="${esc(e.exhibit_id)}">${esc(e.exhibit_id)} — ${
            esc([e.make, e.model].filter(Boolean).join(" ") || "unspecified")}
          </option>`).join("")}</select></div>
      <div class="field"><label>Device (checked against the manual)</label>
        <input id="eDevice" value="${esc(profileName || (dev ? dev.name : ""))}"
          spellcheck="false">
        <span class="help">Leave blank to skip the capability check when
          importing.</span></div>
      <div class="field"><label>Device lock state</label>
        <select id="eLock">${S.env.lock_states.map(s =>
          `<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select></div>
      <div class="field"><label>Owner's own numbers</label>
        <input id="eOwner" placeholder="+919111222333, owner@example.com">
        <span class="help">Comma separated. Lets ARGUS tell the device owner
          apart from their contacts in the connection graph.</span></div>
      <div class="field"><label>Backup password</label>
        <input id="ePw" type="password" placeholder="iOS/Android encrypted backup"></div>
      <div class="field"><label>WhatsApp E2E recovery key</label>
        <input id="eWaKey" placeholder="64 hex digits from WhatsApp → Chats → Backup"
          spellcheck="false" autocomplete="off">
        <span class="help">Required for <code>msgstore.db.crypt15</code> when no device key
          was pulled. Also accepts spaced groups of digits from a screenshot.</span></div>
    </div>

    <h2>Recovery options</h2>
    <label class="check"><input type="checkbox" id="eCarve" checked>
      <span>Recover deleted records
        <small>Carve freeblocks, page slack, freelist pages, WAL frames and
        rollback journals. This is usually the most probative material in the
        case; turn it off only if you need the fastest possible run.</small>
      </span></label>
    <div class="field" style="max-width:280px;margin-top:10px">
      <label>Carve confidence floor</label>
      <input type="number" id="eConf" value="0.45" min="0.1" max="0.95" step="0.05">
      <span class="help">Lower recovers more but admits weaker matches. Every
        carved record is reported with its own confidence.</span></div>

    <div class="actions">
      <button class="btn primary" id="eRun">Start extraction</button>
      <button class="btn" id="eGod">God-level extract</button>
      <span class="spacer"></span>
      <label class="check" style="margin-right:12px"><input type="checkbox" id="eAutoPipe" checked>
        <span>Auto-analyse + intelligence after extract</span></label>
      <span id="ePreview" class="mono" style="font-size:11px;color:var(--fg3)"></span>
      <span id="eMsg" class="mono"></span></div>

    <div id="runBlock"></div>
  </div>`;

  let method = S.preferredMethod || (dev
    ? (dev.transport === "mtp" ? "mtp"
      : (dev.transport === "usbmux" || /ios/i.test(dev.os_family || "") ? "backup" : "comprehensive"))
    : "import");
  if (dev?.transport === "mtp" && !/ios/i.test(dev.os_family || "")) method = "mtp";
  if (dev?.transport === "usbmux" || /ios/i.test(dev.os_family || "")) method = "backup";
  if (method === "ios_backup") method = "backup";
  S.preferredMethod = "";

  const effectiveMethod = () => {
    if (S.device?.transport === "usbmux" || /ios/i.test(S.device?.os_family || "")) {
      const live = method === "import" ? "backup" : method;
      return live === "ios_backup" ? "backup" : live;
    }
    return (S.device?.transport === "mtp" ? "mtp" : method);
  };

  const METHOD_DEFS = {
    import: ["Import existing extraction",
      "MSAB .xry, Cellebrite UFDR, folder, .ab backup, or iOS backup. No device required."],
    turbo: ["Turbo (fast intake)",
      "Filesystem-only, parallel pulls. Skips app discovery, dumpsys, comm exports, carving, and hash verify — for bulk lab intake days."],
    comprehensive: ["Comprehensive (god-level)",
      "4 passes: logical SMS/MMS query → app DB discovery → filesystem + WAL → dumpsys & Vivo/.vivobackup exports. Best for non-root Android (Vivo Y02, Samsung, etc.)."],
    logical: ["Logical (Full read)",
      "Content-provider query only. Fast; pair with filesystem or use Comprehensive for full comms fallbacks."],
    filesystem: ["File system",
      "Pull databases with WAL and journal sidecars. This is what makes deleted-record recovery possible."],
    mtp: ["MTP (file transfer)",
      "Shared storage only. Vivo Y02: unlock Developer options (tap Software version 7×), or export SMS/vCard on-phone then re-extract."],
    backup: ["Backup (iOS / Android)",
      "iPhone: iTunes-style logical backup (messages, calls, app data). Android: adb backup (often empty on Android 12+)."],
    ios_backup: ["iOS backup",
      "Full logical backup via libimobiledevice, then decode."],
  };

  const acquirePayload = () => {
    const spanEl = $("#eSpan");
    const span = spanEl && spanEl.value === "custom"
      ? ($("#eSpanCustom")?.value.trim() || "") : (spanEl?.value || "all");
    const cats = [...m.querySelectorAll(".cat:checked")].map(c => c.value);
    const liveMethod = effectiveMethod();
    return {
      case_path: S.casePath, password: S.casePassword,
      exhibit_id: $("#eExhibit").value, operator: $("#eOp").value.trim(),
      method: liveMethod, time_span: span, categories: cats,
      device_name: $("#eDevice").value.trim(),
      lock_state: $("#eLock").value,
      serial: S.device?.serial || "",
      transport: S.device?.transport || "",
      battery: S.device?.battery ?? null,
      mtp_name: S.device?.name || S.device?.model || "",
      source_path: liveMethod === "import" ? ($("#eSrc")?.value.trim() || "") : "",
      backup_password: $("#ePw").value,
      whatsapp_recovery_key: $("#eWaKey")?.value?.trim() || "",
      whatsapp_passphrase: $("#ePw").value || "",
      owner: $("#eOwner").value.trim(),
      recover_deleted: $("#eCarve").checked,
      carve_confidence: parseFloat($("#eConf").value) || 0.45,
      turbo: liveMethod === "turbo",
      resume: !!S.resumeContainer,
      resume_container: S.resumeContainer || "",
      auto_pipeline: !!$("#eAutoPipe")?.checked,
    };
  };

  let previewTimer = null;
  let preflightTimer = null;
  const paintPreflight = (data) => {
    const host = $("#preflightBlock");
    if (!host) return;
    if (!data || method === "import") {
      host.style.display = "none";
      return;
    }
    host.style.display = "";
    const checks = data.checks || [];
    const rec = (data.preview || {}).recommended_method;
    const rows = checks.map(c => {
      const pill = c.ok ? "ok" : "bad";
      return `<span class="pill ${pill}" title="${esc(c.detail || "")}">${esc(c.label)}</span>`;
    }).join(" ");
    const recHtml = rec && rec !== method
      ? `<div class="note ok" style="margin-top:8px"><b>God-level tip</b> — Manual recommends
        <b>${esc(rec)}</b> for this handset.
        <button class="btn sm primary" id="preflightUseRec" style="margin-left:8px">Switch to ${esc(rec)}</button></div>`
      : (method === "mtp" ? `<div class="note warn" style="margin-top:8px"><b>MTP mode</b> — copies shared storage only.
        For SMS, contacts, and calls: enable USB debugging → run <b>Comprehensive</b>.</div>` : "");
    const errs = (data.errors || []).slice(0, 2).map(e =>
      `<div class="note warn" style="margin-top:6px">${esc(e)}</div>`).join("");
    const warns = (data.warnings || []).slice(0, 3).map(w =>
      `<div class="note" style="margin-top:4px;font-size:11px">${esc(w)}</div>`).join("");
    host.innerHTML = `<b>Preflight</b> ${rows || ""}${recHtml}${errs}${warns}`;
    $("#preflightUseRec")?.addEventListener("click", () => {
      method = rec;
      paintMethodCards();
      paintMethods();
      syncTurboRecovery();
      runAcquirePreview();
    });
  };
  const runAcquirePreflight = () => {
    clearTimeout(preflightTimer);
    preflightTimer = setTimeout(async () => {
      const host = $("#preflightBlock");
      if (!host || !S.casePath || method === "import") {
        paintPreflight(null);
        return;
      }
      try {
        const r = await post("acquire/preflight", acquirePayload());
        paintPreflight(r);
        const btn = $("#eRun");
        if (btn && (r.errors || []).length) btn.disabled = true;
        else if (btn && S.casePath) btn.disabled = false;
      } catch (_) {
        host.style.display = "none";
      }
    }, 400);
  };
  const runAcquirePreview = () => {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(async () => {
      const btn = $("#eRun");
      const host = $("#ePreview");
      if (!host || !S.casePath) {
        if (host && !S.casePath) {
          host.innerHTML = `<span class="pill warn">Open a case first</span>`;
        }
        return;
      }
      try {
        const r = await post("acquire/preview", acquirePayload());
        if (r.ok) {
          host.innerHTML = `<span class="pill ok">Ready</span>`;
        } else {
          host.innerHTML = `<span class="pill bad">${esc((r.errors || [])[0] || "Not ready")}</span>`;
        }
        if ((r.warnings || []).length) {
          host.innerHTML += ` <span class="pill warn">${esc(r.warnings[0])}</span>`;
        }
        runAcquirePreflight();
      } catch (e) {
        host.innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
      }
      if (btn) btn.disabled = false;
    }, 350);
  };

  const paintMethodCards = () => {
    const lock = lockState();
    const allowed = methodsForLock(lock);
    if (!allowed.includes(method)) method = allowed[0] || "import";
    const host = $("#methodCards");
    host.innerHTML = Object.entries(METHOD_DEFS).map(([id, [title, body]]) => {
      const meta = methodMeta(id, lock);
      const enabled = meta.enabled && (id === "import" || !!dev);
      return methodCard(id, title, body + (meta.note && !enabled
        ? ` ${meta.note}` : ""), enabled);
    }).join("");
    host.querySelectorAll(".card").forEach(card => {
      if (card.classList.contains("locked")) return;
      card.onclick = () => {
        method = card.dataset.m;
        paintMethodCards();
        paintMethods();
        syncTurboRecovery();
        runAcquirePreview();
      };
    });
    host.querySelectorAll(".card").forEach(c =>
      c.classList.toggle("sel", c.dataset.m === method));
    const note = $("#methodNote");
    if (!dev) {
      note.innerHTML = `<div class="note">No handset is connected, so live methods are
        unavailable. <b>Import</b> is selected — including native MSAB .xry containers.</div>`;
    } else if (dev.transport === "mtp") {
      note.innerHTML = `<div class="note ok"><b>MTP handset connected</b> — ${
        esc(dev.name || dev.model || "device")}. Shared storage will be copied from the phone.</div>`;
    } else if (S.deviceProfile) {
      const row = (S.deviceProfile.capability_overview || [])
        .find(r => r.lock_state === lock);
      const rec = row?.recommended;
      note.innerHTML = rec && rec !== method
        ? `<div class="note">Manual recommends <b>${esc(rec)}</b> for ${
          esc(row?.label || lock)} on ${esc(S.deviceProfile.device.name)}.
          <div class="actions" style="margin-top:8px">
            <button class="btn sm primary" id="useRecommended">Use recommended (${esc(rec)})</button>
          </div></div>`
        : "";
      $("#useRecommended")?.addEventListener("click", () => {
        method = rec;
        paintMethodCards();
        paintMethods();
        syncTurboRecovery();
        runAcquirePreview();
      });
    } else note.innerHTML = "";
  };

  const paintMethods = () => {
    m.querySelectorAll("#methodCards .card").forEach(c =>
      c.classList.toggle("sel", c.dataset.m === method));
    $("#sourceBlock").innerHTML = method === "import" ? `
      <h2>Evidence source</h2>
      <div class="inline" style="max-width:680px">
        <input id="eSrc" placeholder="Folder, .xry/.xrycase, .ab, iOS backup, UFDR…"
          spellcheck="false" value="${esc(S.source?.path || "")}">
        <button class="btn" id="eBrowse">Browse…</button></div>
      <div id="srcInfo"></div>` : "";
    if (method === "import") {
      $("#eBrowse").onclick = () => openBrowser({
        title: "Choose the evidence folder or backup",
        start: $("#eSrc").value || S.env.workspace, allowFiles: true,
        onPick: p => { $("#eSrc").value = p; classify(p); } });
      $("#eSrc").onchange = () => classify($("#eSrc").value);
      if (S.source?.path) classify(S.source.path);
    }
  };
  const syncTurboRecovery = () => {
    const carve = $("#eCarve");
    if (!carve) return;
    const turbo = method === "turbo";
    carve.checked = !turbo;
    carve.disabled = turbo;
    const tip = $("#mtpTip");
    if (tip) {
      if (method === "mtp") {
        tip.style.display = "";
        const isVivo = /vivo|bbk|iqoo/i.test(
          `${S.device?.manufacturer || ""} ${S.device?.model || ""} ${S.device?.product || ""}`);
        const vivoBlock = isVivo ? `<div class="note warn" style="margin-top:.6rem">
          <b>Vivo Y02 — no “Developer options” in Settings?</b>
          It is <em>hidden</em> until unlocked:
          <b>Settings → System management → About phone → Version info</b> →
          tap <b>Software version</b> (or <b>Build number</b>) <b>7–10 times</b>
          until “You are now a developer”. Then open
          <b>System management → Developer options</b>, turn on
          <b>USB debugging</b> and <b>USB debugging (Security settings)</b>,
          reconnect USB, tap <b>Allow</b> on the phone, and re-run extraction.
          <br><small>On some builds the menu is under
          <b>Additional settings</b> instead of System management.</small>
        </div>` : "";
        const noAdbBlock = `<div class="note" style="margin-top:.6rem">
          <b>No USB debugging possible?</b> On the phone first:
          (1) install <b>SMS Backup &amp; Restore</b> → backup SMS to
          <code>Download/</code>; (2) Contacts → menu →
          <b>Import/Export → Export to storage</b> (.vcf);
          (3) optional WhatsApp chat export. Then run MTP again — ARGUS
          decodes XML/vCard from the copied tree.
        </div>`;
        tip.innerHTML = `<div class="note"><b>MTP — shared storage copy</b>
          Bulk folder copy (same path Explorer uses). Keep the handset unlocked
          on a data cable until the log shows complete.
          ${vivoBlock}${noAdbBlock}
          <br><small>MTP cannot read app-private databases (/data/data) without
          USB debugging.</small></div>`;
      } else if (method === "backup" && /ios|usbmux/i.test(S.device?.os_family || S.device?.transport || "")) {
        tip.style.display = "";
        tip.innerHTML = `<div class="note"><b>Apple iPhone / iPad extraction</b>
          ARGUS will take a logical iTunes-style backup (messages, calls, contacts,
          app data that allows backup). Unlock the device, tap <b>Trust</b>, and
          leave it on a data cable. If libimobiledevice is not installed, ARGUS
          copies Camera Roll from This PC or reuses an existing iTunes backup.</div>`;
      } else {
        tip.style.display = "none";
        tip.innerHTML = "";
      }
    }
  };
  paintMethodCards();
  paintMethods();
  syncTurboRecovery();
  runAcquirePreview();
  runAcquirePreflight();

  $("#eLock")?.addEventListener("change", () => { paintMethodCards(); paintMethods(); runAcquirePreview(); });

  m.querySelectorAll("#eOp,#eExhibit,#eDevice,#eLock,#eOwner,.cat,#eSpan,#eSpanCustom,#eCarve,#eConf")
    .forEach(n => n?.addEventListener("input", runAcquirePreview));
  m.querySelectorAll("#eOp,#eExhibit,#eDevice,#eLock,.cat,#eSpan")
    .forEach(n => n?.addEventListener("change", runAcquirePreview));

  $("#eSpan")?.addEventListener("change", e => {
    $("#customSpan").style.display = e.target.value === "custom" ? "" : "none";
    runAcquirePreview();
  });
  $("#catAll").onclick = () => {
    m.querySelectorAll(".cat").forEach(c => c.checked = true);
    runAcquirePreview();
  };
  $("#catNone").onclick = () => {
    m.querySelectorAll(".cat").forEach(c => c.checked = false);
    runAcquirePreview();
  };

  $("#eRun").onclick = async () => {
    const btn = $("#eRun"); $("#eMsg").textContent = "";
    if (!S.casePath) {
      $("#eMsg").innerHTML = `<span style="color:var(--danger)">Open a case first.</span>`;
      return;
    }
    if (!S.device) {
      try {
        const r = await api("devices?deep=0");
        S.connectedDevices = r.devices || [];
        const ready = S.connectedDevices.filter(d => d.raw?.ready !== false);
        if (ready.length) {
          S.device = ready.find(d => d.transport === "usbmux")
            || ready.find(d => /ios/i.test(d.os_family || ""))
            || ready.find(d => d.transport === "mtp")
            || ready[0];
        }
      } catch (_) {}
    }
    if (S.device?.transport === "mtp" && !/ios/i.test(S.device?.os_family || "")) {
      method = "mtp";
      S.source = null;
      paintMethodCards();
      syncTurboRecovery();
    }
    const payload = acquirePayload();
    const cats = payload.categories;
    if (!payload.operator) {
      $("#eMsg").innerHTML = `<span style="color:var(--danger)">Enter the operator name (chain of custody).</span>`;
      $("#eOp")?.focus();
      return;
    }
    if (!payload.exhibit_id) {
      $("#eMsg").innerHTML = `<span style="color:var(--danger)">Select an exhibit — register one on the Exhibit step if needed.</span>`;
      return;
    }
    if (!cats.length) {
      $("#eMsg").innerHTML = `<span style="color:var(--danger)">Select at least one category.</span>`;
      return;
    }
    if (payload.method === "import" && !payload.source_path) {
      $("#eMsg").innerHTML = `<span style="color:var(--danger)">Choose an evidence folder or backup file to import, or connect the handset for MTP extraction.</span>`;
      return;
    }
    if (payload.method === "mtp" && !payload.serial && !payload.mtp_name) {
      $("#eMsg").innerHTML = `<span style="color:var(--danger)">No MTP handset detected — go to Device and scan again.</span>`;
      return;
    }
    btn.disabled = true;
    try {
      S.lastAcquirePayload = payload;
      try { sessionStorage.setItem("argus_operator", payload.operator); } catch (_) {}
      const r = await post("acquire", payload);
      S.resumeContainer = null;
      S.exhibitId = $("#eExhibit").value;
      watchJob(r.job_id, "runBlock", async (job) => {
        await refreshCase();
        S.containers = (S.caseOverview.extractions || []).map(x => x.path);
        const container = (job?.result || {}).container;
        if (container) S.containers = [container];
        if (job && job.status === "done") {
          const auto = payload.auto_pipeline !== false;
          startAutoTriage(auto);
        }
      });
    } catch (e) {
      $("#eMsg").innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
      btn.disabled = false;
    }
  };
  $("#eGod").onclick = () => {
    m.querySelectorAll(".cat").forEach(c => { c.checked = true; });
    const carve = $("#eCarve");
    if (carve) { carve.checked = false; carve.disabled = true; }
    method = dev?.transport === "mtp" ? "mtp" : "comprehensive";
    paintMethodCards();
    paintMethods();
    syncTurboRecovery();
    const pipe = $("#eAutoPipe");
    if (pipe) pipe.checked = true;
    toast("God-level extract — comprehensive, all categories, auto-analyse", { type: "ok" });
    $("#eRun").click();
  };
  const paintResume = async () => {
    const host = $("#resumeBlock");
    if (!host || !S.casePath) return;
    try {
      const ex = $("#eExhibit")?.value || S.exhibitId || "";
      const q = `case/incomplete?case_path=${encodeURIComponent(S.casePath)}`
        + `&exhibit_id=${encodeURIComponent(ex)}`
        + (S.casePassword ? `&password=${encodeURIComponent(S.casePassword)}` : "");
      const r = await api(q);
      if (!r.incomplete?.length) {
        host.innerHTML = "";
        S.resumeContainer = null;
        return;
      }
      const hit = r.incomplete[0];
      host.innerHTML = `<div class="note bad"><b>Incomplete extraction found</b>
        ${esc(hit.name)} started ${esc((hit.started_at || "").slice(0, 19))}
        by ${esc(hit.operator || "—")} using <b>${esc(hit.method)}</b>.
        Partial evidence is preserved — resume instead of starting over.
        <div class="actions" style="margin-top:10px">
          <button class="btn primary" id="eResume">Resume extraction</button>
          <button class="btn" id="eFresh">Start fresh instead</button>
        </div></div>`;
      $("#eResume").onclick = () => {
        S.resumeContainer = hit.path;
        method = hit.method || method;
        paintMethodCards();
        paintMethods();
        $("#eMsg").innerHTML = `<span class="pill ok">Will resume ${
          esc(hit.name)}</span>`;
      };
      $("#eFresh").onclick = () => {
        S.resumeContainer = null;
        host.innerHTML = "";
      };
    } catch (_) {
      host.innerHTML = "";
    }
  };
  $("#eExhibit")?.addEventListener("change", paintResume);
  paintResume();
  setStat("Ready to extract");
}

function methodCard(id, title, body, enabled) {

    style="${enabled ? "" : "opacity:.4;cursor:not-allowed"}">
    <h3>${esc(title)}</h3>

}

async function classify(path) {
  const box = $("#srcInfo");
  if (!box || !path.trim()) return;
  box.innerHTML = `<div class="note"><span class="spin"></span> Inspecting…</div>`;
  try {
    const r = await api("classify?path=" + encodeURIComponent(path));
    S.source = { path, ...r };
    const cls = r.encrypted ? "warn" : (r.ok ? "ok" : "bad");
    let extra = "";
    if (r.companion_file) {
      extra += `<div style="margin-top:6px"><b>Data file:</b> <code>${
        esc(r.companion_file.split(/[\\/]/).pop())}</code></div>`;
    }
    if (r.embedded && Object.keys(r.embedded).length) {
      extra += `<div style="margin-top:6px"><b>Embedded:</b> ${
        Object.entries(r.embedded).map(([k, v]) => `${v}× ${k}`).join(", ")
      }</div>`;
    }
    if (r.entropy != null) {
      extra += `<div style="margin-top:6px">Entropy: <b>${
        r.entropy.toFixed(2)}</b> bits/byte${
        r.carvable ? " · carvable" : ""}</div>`;
    }
    if (r.import_note) {
      extra += `<div style="margin-top:6px;color:var(--fg2)">${
        esc(r.import_note)}</div>`;
    }
    if (r.recommendation) {
      extra += `<div style="margin-top:6px">${esc(r.recommendation)}</div>`;
    }
    box.innerHTML = `<div class="note ${cls}">
      <b>${esc(r.kind)}</b> — ${esc(r.detail)}
      ${r.warning ? `<div style="margin-top:6px;color:var(--warn)">${
        esc(r.warning)}</div>` : ""}
      ${extra}
    </div>`;
    renderNav();
  } catch (e) {
    box.innerHTML = `<div class="note bad">${esc(e.message)}</div>`;
  }
}

/* ═══════════════════════ job progress / ETA ═══════════════════════ */
const JOB_PHASES = [
  { id: "prepare", label: "Prepare" },
  { id: "inventory", label: "Inventory" },
  { id: "transfer", label: "Transfer" },
  { id: "verify", label: "Verify" },
  { id: "decode", label: "Decode" },
];
const PHASE_WEIGHTS = {
  prepare: [0, 5], inventory: [5, 15], transfer: [15, 70],
  verify: [70, 88], decode: [88, 100],
};

function compositeJobPct(track) {
  const phase = track.phase || "prepare";
  const band = PHASE_WEIGHTS[phase] || [0, 100];
  let inner = 0;
  if (track.tot > 0) inner = Math.min(1, (track.cur || 0) / track.tot);
  else if (track.jobsTot > 0) inner = Math.min(1, (track.jobsCur || 0) / track.jobsTot);
  else inner = Math.min(1, (track.pct || 0) / 100);
  return band[0] + (band[1] - band[0]) * inner;
}

function formatDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}m ${String(s).padStart(2, "0")}s`;
  }
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return `${h}h ${m}m`;
}

function humanBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return `${n} B`;
  if (n < 1024 ** 2) return `${(n / 1024).toFixed(1)} KB`;
  if (n < 1024 ** 3) return `${(n / (1024 ** 2)).toFixed(1)} MB`;
  return `${(n / (1024 ** 3)).toFixed(2)} GB`;
}

function resetJobProgressTrack(jobStartedAt) {
  const t0 = jobStartedAt ? Date.parse(jobStartedAt) : Date.now();
  S.jobProgressTrack = {
    startedAt: Number.isFinite(t0) ? t0 : Date.now(),
    anchor: null,
    cur: 0, tot: 0, pct: 0, mod: "", kind: "",
    phase: "prepare", bytesCur: 0, bytesTot: 0,
    etaSec: 0, rate: 0, rateUnit: "files/s",
    lastMessage: "",
    fileCur: 0, fileTot: 0, subMod: "", subPct: 0,
    jobsCur: 0, jobsTot: 0,
  };
}

function inferPhase(line) {
  if (line.phase) return line.phase;
  const mod = (line.module || "").toLowerCase();
  const msg = (line.message || "").toLowerCase();
  const st = (line.status || "").toLowerCase();
  if (mod === "decode" || st === "decode" || mod === "ingest") return "decode";
  if (mod === "mtp" && msg.includes("list")) return "inventory";
  if (mod === "mtp" && (msg.includes("hash") || msg.includes("reconcil"))) return "verify";
  if (mod === "mtp" && (msg.includes("copy") || st === "progress")) return "transfer";
  if (mod === "engine" && st === "start") return "prepare";
  if (mod.includes("filesystem") || mod.includes("adb")) return "transfer";
  return "";
}

function noteJobProgress(track, line, job) {
  if (!track) return;
  const now = Date.now();
  const phase = inferPhase(line) || (job && job.phase) || track.phase;
  if (phase) track.phase = phase;

  if (line.batch_pct != null) {
    track.kind = "batch";
    track.pct = Math.max(track.pct, Number(line.batch_pct));
    track.cur = Number(line.batch_current) || track.cur;
    track.tot = Number(line.batch_total) || track.tot;
    track.mod = "batch";
  }
  if (line.progress_pct != null) {
    const incomingCur = Number(line.progress_current);
    const incomingTot = Number(line.progress_total);
    if (track.kind === "batch") {
      track.subPct = Number(line.progress_pct);
      if (Number.isFinite(incomingCur))
        track.fileCur = Math.max(track.fileCur || 0, incomingCur);
      if (Number.isFinite(incomingTot))
        track.fileTot = Math.max(track.fileTot || 0, incomingTot);
      track.subMod = (line.module || "").toLowerCase();
    } else {
      track.kind = "file";
      if (Number.isFinite(incomingTot) && incomingTot > 0)
        track.tot = Math.max(track.tot || 0, incomingTot);
      if (Number.isFinite(incomingCur))
        track.cur = Math.max(track.cur || 0, incomingCur);
      if (track.tot > 0) {
        const cap = (phase === "verify" || phase === "decode") ? 100 : 99.5;
        track.pct = Math.max(track.pct, Math.min(cap, 100 * track.cur / track.tot));
      } else
        track.pct = Math.max(track.pct, Number(line.progress_pct) || 0);
      track.mod = (line.module || "").toLowerCase();
    }
  }
  if (line.jobs_current != null) track.jobsCur = Number(line.jobs_current);
  if (line.jobs_total != null) track.jobsTot = Number(line.jobs_total);
  if (line.bytes_current != null) track.bytesCur = Number(line.bytes_current);
  if (line.bytes_total != null) track.bytesTot = Number(line.bytes_total);
  if (line.bytes != null && !line.bytes_total) track.bytesCur += Number(line.bytes);
  if (line.eta_seconds != null) track.etaSec = Number(line.eta_seconds);
  if (line.rate != null) track.rate = Number(line.rate);
  if (line.rate_unit) track.rateUnit = line.rate_unit;
  if (line.message) track.lastMessage = line.message;

  if (job) {
    if (job.eta_seconds) track.etaSec = Number(job.eta_seconds);
    if (job.bytes_current) track.bytesCur = Number(job.bytes_current);
    if (job.bytes_total) track.bytesTot = Number(job.bytes_total);
    if (job.rate) track.rate = Number(job.rate);
    if (job.rate_unit) track.rateUnit = job.rate_unit;
    if (job.phase) track.phase = job.phase;
    if (job.progress > 0) track.pct = Math.max(track.pct, job.progress * 100);
  }

  if (track.cur > 0 && track.tot > 0) {
    if (!track.anchor || track.cur >= track.anchor.cur + 10) {
      track.anchor = { at: now, cur: track.cur };
    }
  }
}

function jobProgressSummary(track) {
  if (!track) return {
    pct: 0, label: "Starting…", eta: "Estimating…", detail: "",
    speed: "—", volume: "—", elapsed: "0s", finishAt: "",
  };
  const now = Date.now();
  const elapsed = (now - track.startedAt) / 1000;
  let pct = Math.min(100, Math.max(0, compositeJobPct(track)));
  if (track.phase && (track.tot > 0 || track.jobsTot > 0 || track.pct > 0)) {
    pct = Math.max(pct, Math.min(100, compositeJobPct(track)));
  } else {
    pct = Math.min(100, Math.max(0, track.pct || 0));
  }
  if (track.tot <= 0 && track.jobsTot > 0) {
    pct = Math.max(pct, Math.min(95, 100 * (track.jobsCur || 0) / track.jobsTot));
  }

  let etaSec = track.etaSec || 0;
  if (!etaSec && track.tot > 0 && track.cur > 0 && track.cur < track.tot && track.anchor) {
    const span = (now - track.anchor.at) / 1000;
    if (span >= 5) {
      const rate = (track.cur - track.anchor.cur) / span;
      if (rate > 0) etaSec = (track.tot - track.cur) / rate;
    }
  }
  if (!etaSec && track.jobsTot > 0 && track.jobsCur > 0 && track.jobsCur < track.jobsTot && elapsed >= 8) {
    const rate = track.jobsCur / elapsed;
    if (rate > 0) etaSec = (track.jobsTot - track.jobsCur) / rate;
  }

  let eta = "Estimating time…";
  let finishAt = "";
  if (etaSec > 0 && (track.cur < track.tot || (track.jobsTot > 0 && track.jobsCur < track.jobsTot))) {
    const finish = new Date(now + etaSec * 1000);
    finishAt = finish.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    eta = `~${formatDuration(etaSec)} remaining`;
  } else if (track.tot <= 0 && track.cur > 0 && track.jobsTot > 0) {
    eta = `${track.jobsCur}/${track.jobsTot} folders copied — listing still running`;
  } else if (track.tot <= 0 && track.cur > 0) {
    eta = `${track.cur.toLocaleString()} files on disk — inventory still running`;
  } else if (track.tot > 0 && track.cur === 0 && elapsed >= 15) {
    eta = "Waiting for first files…";
  } else if (pct >= 99 && track.phase !== "verify" && track.phase !== "decode") {
    eta = "Finishing up…";
  } else if (track.phase === "verify") {
    eta = track.tot > 0 && track.cur < track.tot
      ? `Verifying ${track.cur.toLocaleString()}/${track.tot.toLocaleString()}…`
      : "Hashing and reconciling…";
  } else if (track.phase === "decode") {
    eta = "Decoding artifacts…";
  }

  let speed = "—";
  if (track.rate > 0) {
    speed = track.rateUnit === "files/s"
      ? `${track.rate.toFixed(1)} files/s`
      : `${track.rate.toFixed(1)}/s`;
  } else if (track.cur > 0 && elapsed > 5) {
    speed = `${(track.cur / elapsed).toFixed(1)} files/s`;
  }

  let volume = "—";
  if (track.bytesTot > 0) {
    volume = `${humanBytes(track.bytesCur)} / ${humanBytes(track.bytesTot)}`;
  } else if (track.bytesCur > 0) {
    volume = humanBytes(track.bytesCur);
  }

  let label = track.lastMessage || "Acquisition in progress";
  if (track.kind === "batch" && track.tot > 0) {
    label = `Device ${track.cur} of ${track.tot}`;
    if (track.fileTot > 0) {
      const kind = track.subMod === "mtp" ? "MTP" : "Files";
      label += ` · ${kind}: ${track.fileCur.toLocaleString()} / ${track.fileTot.toLocaleString()}`;
    }
  } else if (track.tot > 0) {
    const kind = track.mod === "mtp" ? "MTP" : "Files";
    label = `${kind}: ${track.cur.toLocaleString()} / ${track.tot.toLocaleString()}`;
  } else if (track.cur > 0) {
    label = `${track.cur.toLocaleString()} files on disk`;
    if (track.jobsTot > 0)
      label += ` · ${track.jobsCur}/${track.jobsTot} folders`;
  }

  const phaseLabel = (JOB_PHASES.find(p => p.id === track.phase) || {}).label || "Working";
  return {
    pct, label, eta, detail: `${formatDuration(elapsed)} elapsed`,
    speed, volume, elapsed: formatDuration(elapsed), finishAt, phaseLabel,
  };
}

function paintJobPhases(track, host) {
  if (!host) return;
  const order = JOB_PHASES.map(p => p.id);
  const idx = Math.max(0, order.indexOf(track.phase || "prepare"));
  host.innerHTML = JOB_PHASES.map((p, i) => {
    const cls = i < idx ? "done" : (i === idx ? "active" : "");
    return `<span class="job-phase ${cls}">${esc(p.label)}</span>`;
  }).join("");
}

function paintJobProgress(refs, track) {
  const sum = jobProgressSummary(track);
  const { prog, progBar, progPct, progEta, progLabel, progPhases,
          statEta, statElapsed, statSpeed, statVolume, phaseTitle } = refs;
  if (sum.pct > 0) {
    prog.classList.remove("indet");
    progBar.style.width = `${sum.pct}%`;
  }
  if (progPct) progPct.textContent = `${sum.pct.toFixed(0)}%`;
  if (progEta) {
    progEta.innerHTML = `${esc(sum.eta)}${
      sum.finishAt ? `<div class="sub">Done ~${esc(sum.finishAt)}</div>` : ""}`;
  }
  if (progLabel) progLabel.textContent = sum.label;
  if (phaseTitle) phaseTitle.textContent = sum.phaseLabel;
  if (statEta) statEta.textContent = sum.eta.replace(" remaining", "");
  if (statElapsed) statElapsed.textContent = sum.elapsed;
  if (statSpeed) statSpeed.textContent = sum.speed;
  if (statVolume) statVolume.textContent = sum.volume;
  paintJobPhases(track, progPhases);
  S.jobProgress = sum.pct;
}

/* ═══════════════════════ job watcher ═══════════════════════ */
function startAutoTriage(openAnalyse = false) {
  if (!S.containers.length) return;
  toast("God-level triage — ranking findings on the sealed extraction", { type: "ok" });
  post("intelligence/run", {
    containers: S.containers,
    owner: $("#eOwner")?.value || S.owner || "",
  }).then(r => {
    if (r.job_id && $("#runBlock")) {
      watchJob(r.job_id, "runBlock", () => {
        S.intel = null;
        if (openAnalyse) {
          S.view = "analyse";
          renderNav();
          route();
          toast("God-level pipeline complete — command center ready", { type: "ok" });
        } else {
          toast("Findings ready — open the Findings step", { type: "ok" });
        }
      });
    } else if (openAnalyse) {
      S.view = "analyse";
      renderNav();
      route();
    }
  }).catch(e => toast(e.message, { type: "bad" }));
}

function watchJob(jobId, mountId, onDone) {
  S.jobSeq = 0;
  S.jobProgress = 0;
  resetJobProgressTrack();
  const mount = $("#" + mountId);
  if (!mount) {
    const poll = async () => {
      try {
        const j = await api(`job?id=${jobId}&since=0`);
        S.job = j;
        if (["done", "failed", "cancelled"].includes(j.status)) {
          if (onDone) await onDone(j);
          return;
        }
      } catch (_) {}
      setTimeout(poll, 900);
    };
    poll();
    return;
  }
  mount.innerHTML = `
    <h2>Extraction log</h2>
    <div class="job-progress-card">
      <h3>Live acquisition <span class="phase-pill" id="jobPhaseTitle">Starting</span></h3>
      <div class="job-phase-row" id="jobPhases"></div>
      <div class="progress indet" id="jobProg"><i id="jobProgBar"></i></div>
      <div class="job-progress-meta">
        <span class="pct" id="jobProgPct">0%</span>
        <span class="eta" id="jobProgEta">Estimating time…</span>
      </div>
      <div class="job-statgrid">
        <div class="job-stat"><div class="lbl">Time left</div><div class="val" id="jobStatEta">—</div></div>
        <div class="job-stat"><div class="lbl">Elapsed</div><div class="val" id="jobStatElapsed">0s</div></div>
        <div class="job-stat"><div class="lbl">Speed</div><div class="val" id="jobStatSpeed">—</div></div>
        <div class="job-stat"><div class="lbl">Data</div><div class="val" id="jobStatVolume">—</div></div>
      </div>
      <div class="job-progress-detail mono" id="jobProgLabel">Waiting for progress…</div>
    </div>
    <div class="logwrap" id="logBox"></div>
    <div class="actions">
      <button class="btn danger sm" id="jCancel">Request cancel</button>
      <span class="spacer"></span>
      <span class="mono" id="jStat"></span></div>
    <div id="jResult"></div>`;
  mount.scrollIntoView({ behavior: "smooth", block: "start" });
  $("#jCancel").onclick = () => post("job/cancel", { id: jobId });

  const box = $("#logBox");
  const refs = {
    prog: $("#jobProg"),
    progBar: $("#jobProgBar"),
    progPct: $("#jobProgPct"),
    progEta: $("#jobProgEta"),
    progLabel: $("#jobProgLabel"),
    progPhases: $("#jobPhases"),
    phaseTitle: $("#jobPhaseTitle"),
    statEta: $("#jobStatEta"),
    statElapsed: $("#jobStatElapsed"),
    statSpeed: $("#jobStatSpeed"),
    statVolume: $("#jobStatVolume"),
  };
  const track = S.jobProgressTrack;
  const updateProgress = (line, job) => {
    noteJobProgress(track, line, job);
    paintJobProgress(refs, track);
  };
  let lastLive = "";
  clearInterval(S.jobTimer);
  const poll = async () => {
    try {
      const j = await api(`job?id=${jobId}&since=${S.jobSeq}`);
      S.job = j;
      if (j.started_at && !track._synced) {
        track.startedAt = Date.parse(j.started_at) || track.startedAt;
        track._synced = true;
      }
      j.log.forEach(line => {
        S.jobSeq = line.seq;
        updateProgress(line, j);
        const warn = line.level === "warning" || line.status === "warning";
        if (warn && (line.module === "device" || line.module === "mtp.session"
            || line.module === "adb.session")) {
          S.deviceHealth = {
            ok: false,
            label: line.module.replace(".session", "").toUpperCase(),
            detail: line.message,
          };
        } else if (line.status === "ok" && line.module?.includes("session")) {
          S.deviceHealth = { ok: true, label: "Device OK", detail: line.message };
        }
        const d = el("div", "logline " + (line.level || "info") + (warn ? " warnline" : ""));
        d.innerHTML = `<span class="t">${esc((line.ts || "").slice(11, 23))}</span>
          <span class="m">${esc(line.module)}</span>
          <span class="s">${esc(line.status)}</span>
          <span>${esc(line.message)}</span>`;
        box.appendChild(d);
        lastLive = `${line.module}: ${line.message}`;
      });
      if (j.status === "running") {
        noteJobProgress(track, {}, j);
        paintJobProgress(refs, track);
      }
      if (j.log.length) {
        box.scrollTop = box.scrollHeight;
        setStat(lastLive);
      }
      $("#jStat").textContent = `${j.status} · ${j.log_length} log lines`;
      renderHeader();

      if (["done", "failed", "cancelled"].includes(j.status)) {
        clearInterval(S.jobTimer);
        refs.prog.classList.remove("indet");
        refs.progBar.style.width = "100%";
        const sum = jobProgressSummary(track);
        if (refs.progPct) refs.progPct.textContent = "100%";
        if (refs.progEta) refs.progEta.textContent = j.status === "done" ? "Complete" : j.status;
        if (refs.progLabel) {
          refs.progLabel.textContent = j.status === "done"
            ? `Finished in ${sum.elapsed}`
            : j.status;
        }
        if (refs.statEta) refs.statEta.textContent = j.status === "done" ? "Done" : j.status;
        $("#jCancel").disabled = true;
        renderJobResult(j);
        if (onDone) await onDone(j);
        renderNav();
      }
    } catch (e) {
      $("#jStat").innerHTML = `<span style="color:var(--warn)">Reconnecting… ${esc(e.message)}</span>`;
      S.jobPollBackoff = Math.min(2000, (S.jobPollBackoff || 250) * 1.5);
      clearInterval(S.jobTimer);
      S.jobTimer = setTimeout(poll, S.jobPollBackoff);
    }
  };
  S.jobPollBackoff = 250;
  poll();
  S.jobTimer = setInterval(poll, 250);
}

function renderJobResult(j) {
  const out = $("#jResult");
  if (!out) return;
  if (j.status === "failed") {
    out.innerHTML = `<div class="note bad"><b>Extraction failed</b>${
      esc(j.error)}</div>
      ${j.traceback ? `<details style="margin-top:10px"><summary class="mono" style="cursor:pointer">Technical details</summary>
        <pre style="white-space:pre-wrap;font-size:11px;margin-top:8px;color:var(--fg3)">${esc(j.traceback)}</pre></details>` : ""}
      <div class="actions">
        <button class="btn primary" id="retryAcquire">Retry with same settings</button>
        <button class="btn" id="diagDevice">Diagnose connection</button>
        <button class="btn sm" id="copyErr">Copy error</button>
      </div>`;
    $("#retryAcquire")?.addEventListener("click", async () => {
      if (!S.lastAcquirePayload) return;
      try {
        const r = await post("acquire", S.lastAcquirePayload);
        watchJob(r.job_id, "runBlock", async () => {
          await refreshCase();
          S.containers = (S.caseOverview.extractions || []).map(x => x.path);
        });
      } catch (e) { toast(e.message, { type: "bad" }); }
    });
    $("#diagDevice")?.addEventListener("click", () => {
      S.view = "device"; renderNav(); route();
    });
    $("#copyErr")?.addEventListener("click", () => {
      navigator.clipboard?.writeText(`${j.error}\n\n${j.traceback || ""}`);
      toast("Copied to clipboard", { type: "ok" });
    });
    const btn = $("#eRun"); if (btn) btn.disabled = false;
    return;
  }
  const r = j.result || {};
  if (r.results && r.total != null) {
    const rows = (r.results || []).map(x =>
      `<tr><td>${esc(x.exhibit_id || "—")}</td><td class="mono">${
        esc(x.serial)}</td><td>${esc(x.status)}</td><td>${num(x.artifacts)}</td>`
      + `<td class="mono">${esc((x.container || "").split(/[\\/]/).pop() || "—")}</td>`
      + `${x.error ? `<td class="mono" style="color:var(--danger)">${esc(x.error)}</td>`
        : "<td></td>"}</tr>`).join("");
    out.innerHTML = `<div class="note ${r.failed ? "warn" : "ok"}"><b>Batch extraction complete</b>
      ${num(r.completed)} succeeded · ${num(r.failed)} failed · ${num(r.skipped)} skipped</div>
      <table class="tbl"><thead><tr><th>Exhibit</th><th>Serial</th><th>Status</th>
      <th>Artifacts</th><th>Container</th><th>Error</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="actions">
        ${r.failed ? `<button class="btn primary" id="retryBatchFailed">Retry failed (${r.failed})</button>` : ""}
        <button class="btn" id="goAnalyse">Review case extractions →</button>
      </div>`;
    $("#retryBatchFailed")?.addEventListener("click", async () => {
      if (!S.lastBatchPayload) return;
      const failed = (r.results || []).filter(x =>
        x.status === "failed" || x.error);
      if (!failed.length) return;
      const orig = S.lastBatchPayload.devices || [];
      const bySerial = Object.fromEntries(orig.map(d => [d.serial, d]));
      try {
        const body = {
          ...S.lastBatchPayload,
          all_connected: false,
          devices: failed.map(x => {
            const base = bySerial[x.serial] || {};
            return {
              serial: x.serial,
              exhibit_id: x.exhibit_id || base.exhibit_id || "",
              device_name: x.device_name || base.device_name || "",
              method: base.method || S.lastBatchPayload.method || "turbo",
              transport: base.transport || "",
              mtp_name: base.mtp_name || "",
              make: base.make || "",
              model: base.model || "",
              imei: base.imei || "",
            };
          }),
        };
        S.lastBatchPayload = body;
        const resp = await post("acquire/batch", body);
        toast(`Retrying ${failed.length} failed device(s)`, { type: "warn" });
        watchJob(resp.job_id, "runBlock", async () => {
          await refreshCase();
          S.containers = (S.caseOverview.extractions || []).map(x => x.path);
        });
      } catch (e) { toast(e.message, { type: "bad" }); }
    });
    $("#goAnalyse")?.addEventListener("click", () => { S.view = "analyse"; renderNav(); route(); });
    return;
  }
  if (j.kind === "report") {
    out.innerHTML = `<div class="note ok"><b>Report generated</b>
      ${num(r.artifact_count)} artifacts · ${num(r.deleted_count)} recovered
      from deleted space</div>
      <table><thead><tr><th>File</th><th>Size</th><th>Location</th></tr></thead>
      <tbody>${(r.files || []).map(f => `<tr><td><b>${esc(f.name)}</b></td>
        <td class="mono">${human(f.size)}</td>
        <td class="mono">${esc(f.path)}</td></tr>`).join("")}</tbody></table>`;
    S.lastReport = r;
    return;
  }
  const bad = (r.integrity_failures || []).length;
  const audits = r.audit_warnings || [];
  const crit = audits.filter(a => a.severity === "critical");
  const action = audits.filter(a => a.severity === "action_required");
  const decodePct = r.decode_coverage_pct != null ? r.decode_coverage_pct : null;
  const commsCats = ["Messages", "Contacts", "Calls", "Chats"];
  const commsKpi = commsCats.map(c => {
    const n = (r.categories || {})[c] || 0;
    return n > 0 ? `<span class="pill ok">${esc(c)}: ${num(n)}</span>` : "";
  }).filter(Boolean).join(" ");
  const acqSum = r.acquisition_summary || {};
  const providerRows = acqSum.comms_row_total || 0;
  const mtpBanner = (r.method === "mtp" && !providerRows && !commsKpi)
    ? `<div class="note warn"><b>MTP limitation</b> — live SMS/contacts/calls were not acquired.
      Enable USB debugging and re-run <b>Comprehensive</b> for full communications.</div>` : "";
  out.innerHTML = `
    <div class="note ${bad ? "warn" : "ok"}"><b>${esc(r.status || "Completed")}</b>
      ${num(r.artifacts)} artifacts decoded, of which
      <b>${num(r.deleted_recovered)}</b> were recovered from deleted or
      unallocated space and were not visible to the device user.</div>
    ${mtpBanner}
    ${commsKpi ? `<div class="inline" style="margin:8px 0;gap:6px;flex-wrap:wrap">${commsKpi}</div>` : ""}
    ${providerRows ? `<div class="note" style="margin-bottom:8px">Acquisition captured <b>${num(providerRows)}</b> live provider row(s) before decode.</div>` : ""}
    <div id="extractRecs" class="grid one" style="margin:10px 0"></div>
    ${decodePct != null ? `<div class="grid three" style="margin-bottom:12px">
      <div class="card"><h3>Decode coverage</h3>
        <div class="big">${decodePct}%</div>
        <div class="muted">${num(r.files_parsed)} / ${num(r.files_seen)} files parsed</div></div>
      <div class="card"><h3>Acquired</h3>
        <div class="big">${num(r.files_acquired)}</div>
        <div class="muted">${human(r.bytes_acquired)}</div></div>
      <div class="card"><h3>Duration</h3>
        <div class="big">${r.duration_seconds}s</div>
        <div class="muted">${esc(r.method || "extraction")}</div></div>
    </div>` : ""}
    ${crit.length ? `<div class="note bad"><b>Critical</b><br>${crit.map(a => esc(a.message)).join("<br>")}</div>` : ""}
    ${action.length ? `<div class="note warn"><b>Action required</b><br>${action.map(a => esc(a.message)).join("<br>")}</div>` : ""}
    <div class="grid two">
      <div class="card"><h3>Extraction</h3><dl class="kv">
        <dt>Container</dt><dd>${esc((r.container || "").split(/[\\/]/).pop())}</dd>
        <dt>Location</dt><dd class="mono" style="word-break:break-all;font-size:11px">${esc(r.container || "—")}</dd>
        ${r.export_zip ? `<dt>ZIP file</dt><dd class="mono" style="word-break:break-all;font-size:11px">${esc(r.export_zip)}</dd>` : ""}
        <dt>Duration</dt><dd>${r.duration_seconds}s</dd>
        <dt>Files</dt><dd>${num(r.files_acquired)}</dd>
        <dt>Acquired</dt><dd>${human(r.bytes_acquired)}</dd>
        <dt>Seal</dt><dd>${esc((r.seal?.container_seal || "").slice(0, 24))}…</dd>
      </dl></div>
      <div class="card"><h3>Categories</h3><dl class="kv">
        ${Object.entries(r.categories || {}).map(([k, v]) =>
          `<dt>${esc(k)}</dt><dd>${num(v)}</dd>`).join("")}
      </dl></div>
    </div>
    ${(r.warnings || []).length ? `<div class="note warn"><b>${
      r.warnings.length} warning(s)</b>${r.warnings.slice(0, 8)
        .map(esc).join("<br>")}</div>` : ""}
    <div class="note" style="margin-top:12px">Extraction saved as a portable <b>.afc.zip</b> file — copy it anywhere and import or analyse later.</div>
    <div class="actions">
      ${r.export_zip ? `<button class="btn primary" id="openZip">Open ZIP file</button>` : ""}
      <button class="btn ${r.export_zip ? "" : "primary"}" id="openContainer">Open extraction folder</button>
      ${r.export_zip ? "" : `<button class="btn" id="saveContainerZip">Save as ZIP</button>`}
      <button class="btn sm" id="copyContainerPath">Copy path</button>
      <button class="btn" id="goAnalyse">Analyse this extraction →</button>
      <button class="btn" id="goIntel">Run intelligence →</button>
      <button class="btn" id="goAgain">Run another extraction</button></div>`;
  $("#openZip")?.addEventListener("click", () => openContainerFolder(r.export_zip));
  $("#openContainer")?.addEventListener("click", () => openContainerFolder(r.container));
  if (!r.export_zip) $("#saveContainerZip")?.addEventListener("click", () => saveContainerZip(r.container));
  $("#copyContainerPath")?.addEventListener("click", () => {
    const text = r.export_zip || r.container || "";
    navigator.clipboard?.writeText(text);
    toast("Path copied to clipboard", { type: "ok" });
  });
  if ($("#goAnalyse")) $("#goAnalyse").onclick = async () => {
    await refreshCase();
    S.containers = (S.caseOverview?.extractions || []).map(x => x.path);
    if (!S.containers.length && r.container) S.containers = [r.container];
    S.view = "analyse"; renderNav(); route(); };
  if ($("#goIntel")) $("#goIntel").onclick = async () => {
    await refreshCase();
    S.containers = (S.caseOverview?.extractions || []).map(x => x.path);
    if (!S.containers.length && r.container) S.containers = [r.container];
    S.view = "findings"; S.intel = null; renderNav(); route(); };
  if ($("#goAgain")) $("#goAgain").onclick = () => { S.view = "extract"; route(); };
  if (r.container) {
    api(`dashboard?containers=${encodeURIComponent(r.container)}`).then(dash => {
      const recs = dash.recommendations || [];
      const host = $("#extractRecs");
      if (!host || !recs.length) return;
      host.innerHTML = `<h3 style="margin:0 0 8px">Next steps</h3>` + recs.slice(0, 4).map(rec =>
        `<div class="card" style="margin-bottom:8px;cursor:pointer" data-view="${esc(rec.view || "")}">
          <b>${esc(rec.title)}</b>
          <div class="muted" style="font-size:12px;margin-top:4px">${esc(rec.detail || "")}</div>
          <span class="pill ${rec.severity === "critical" ? "bad" : rec.severity === "high" ? "warn" : "ok"}">${esc(rec.severity || "info")}</span>
        </div>`).join("");
      host.querySelectorAll(".card[data-view]").forEach(card => {
        card.onclick = () => {
          const v = card.dataset.view;
          if (v === "extract") S.view = "extract";
          else if (v === "findings") S.view = "findings";
          else S.view = "analyse";
          renderNav(); route();
        };
      });
    }).catch(() => {});
  }
}

    <h1>Analyse — Horizon</h1>

    <div class="cards" id="exCards">${ex.map(x => `

          ${x.zip_path ? `<dt>ZIP</dt><dd class="mono" style="font-size:11px;word-break:break-all">${esc(x.zip_path.split(/[\\/]/).pop())}</dd>` : ""}
        </dl>
        <div class="actions" style="margin-top:10px">
          ${x.zip_path ? `<button class="btn sm open-zip-btn" data-path="${esc(x.zip_path)}">ZIP</button>` : ""}

          ${!x.zip_path ? `<button class="btn sm save-container-btn" data-path="${esc(x.path)}">Save ZIP</button>` : ""}

  m.querySelectorAll(".open-zip-btn").forEach(btn => {

  });
  m.querySelectorAll(".open-container-btn").forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); openContainerFolder(btn.dataset.path); };

  m.querySelectorAll(".save-container-btn").forEach(btn => {

      S.containers = S.containers.includes(p)

  $("#aOpen").onclick = () => openAnalysis();

      if (!/\.zip$/i.test(path)) {

  $("#aReport").onclick = () => { S.view = "report"; renderNav(); route(); };
  $("#aFindings").onclick = () => { S.intel = null; S.view = "findings";

  setStat(`${ex.length} extraction(s) in this case`);
