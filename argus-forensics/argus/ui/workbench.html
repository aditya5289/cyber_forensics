<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS Forensics</title>
<style>
:root{
  --bg:#0e1116; --bg2:#151a22; --bg3:#1c232d; --bg4:#232c38;
  --line:#2a3340; --line2:#374252;
  --fg:#dfe6ef; --fg2:#93a1b3; --fg3:#61707f;
  --accent:#4ea8de; --accent2:#2b6cb0;
  --warn:#e2b33c; --danger:#e5534b; --ok:#3fb950; --deleted:#c678dd;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.55 var(--sans);
  overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2f3a47;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3d4a5a}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* ───────── header ───────── */
header{background:var(--bg2);border-bottom:1px solid var(--line);
  padding:0 16px;display:flex;align-items:center;gap:18px;height:52px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;
  letter-spacing:.1em;font-size:14px;color:var(--accent)}
#buildTag{font:11px var(--mono);opacity:.75}
.card.blocked{opacity:.72;cursor:default;border-style:dashed}
.pill.bad{background:#5a2f2c;color:#f0918a;border-color:#5a2f2c}
.brand em{font-style:normal;color:var(--fg3);font-weight:400;letter-spacing:0;
  font-size:11px}
.crumbs{display:flex;gap:14px;font-size:12px;color:var(--fg2);flex-wrap:wrap}
.crumbs b{color:var(--fg);font-weight:600}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;
  padding:4px 10px;border-radius:99px;border:1px solid var(--line);
  color:var(--fg2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#1f4d2a;background:#112417}
.chip.bad{color:var(--danger);border-color:#5a2320;background:#2a1413}
.chip.warn{color:var(--warn);border-color:#4d411a;background:#221c0e}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ───────── layout ───────── */
.body{display:grid;grid-template-columns:236px 1fr;overflow:hidden}
nav{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;
  padding:14px 0}
.navhead{font-size:10px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--fg3);padding:8px 16px 6px}
.step{display:flex;align-items:center;gap:11px;padding:9px 16px;cursor:pointer;
  color:var(--fg2);border-left:2px solid transparent;font-size:13px}
.step:hover{background:var(--bg3);color:var(--fg)}
.step.active{background:var(--bg3);color:var(--fg);border-left-color:var(--accent)}
.step.done .num{background:var(--ok);color:#08130c;border-color:var(--ok)}
.step.locked{opacity:.4;cursor:not-allowed}
.step.locked:hover{background:transparent;color:var(--fg2)}
.num{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:11px;font-family:var(--mono);
  flex:none;background:var(--bg)}
.step.active .num{border-color:var(--accent);color:var(--accent)}
.step small{display:block;font-size:10.5px;color:var(--fg3);line-height:1.3}

main{overflow:auto;position:relative}
.pane{padding:26px 30px;max-width:1180px}
.pane.wide{max-width:none}
.pane.flush{padding:0;max-width:none;height:100%}
h1{font-size:21px;font-weight:600;margin-bottom:5px}
.lede{color:var(--fg2);font-size:13px;margin-bottom:22px;max-width:760px}
.lede code{font-family:var(--mono);font-size:12px;background:var(--bg3);
  padding:1px 5px;border-radius:4px}
h2{font-size:13px;font-weight:600;margin:26px 0 12px;
  padding-bottom:7px;border-bottom:1px solid var(--line);color:var(--fg)}
h2:first-of-type{margin-top:0}

/* ───────── forms ───────── */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--fg2);font-weight:500}
.field .req{color:var(--warn)}
.field .help{font-size:11px;color:var(--fg3);line-height:1.45}
input[type=text],input[type=password],input[type=number],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:8px 11px;outline:none;width:100%;color:var(--fg)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:#4a5866}
textarea{resize:vertical;min-height:70px;font-family:inherit}
select{cursor:pointer}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1}

.btn{background:var(--bg3);border:1px solid var(--line);border-radius:7px;
  padding:8px 15px;cursor:pointer;color:var(--fg2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.primary:hover:not(:disabled){background:#3a7fc4}
.btn.danger{color:var(--danger);border-color:#5a2320}
.btn.sm{padding:5px 10px;font-size:12px}
.actions{display:flex;gap:10px;margin-top:24px;align-items:center;flex-wrap:wrap}
.actions .spacer{flex:1}

.check{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;
  border-radius:7px;cursor:pointer;font-size:12.5px}
.check:hover{background:var(--bg3)}
input[type=checkbox],input[type=radio]{width:15px;height:15px;accent-color:var(--accent);
  cursor:pointer;flex:none;margin-top:2px}
.check span small{display:block;color:var(--fg3);font-size:11px;line-height:1.4}

/* ───────── cards ───────── */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:16px}
.card h3{font-size:12.5px;font-weight:600;margin-bottom:11px;
  display:flex;align-items:center;gap:8px}
.card.pick{cursor:pointer}
.card.pick:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);background:#16202b}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px}
.kv dt{color:var(--fg2);white-space:nowrap}
.kv dd{font-family:var(--mono);font-size:11.5px;word-break:break-word;
  text-align:right}

.note{padding:11px 14px;border-radius:8px;font-size:12.5px;line-height:1.55;
  margin:14px 0;border:1px solid var(--line);background:var(--bg2)}
.note.warn{border-color:#4d411a;background:#1c1810;color:#e8cf88}
.note.bad{border-color:#5a2320;background:#231413;color:#f0a29c}
.note.ok{border-color:#1f4d2a;background:#101d14;color:#8fd7a3}
.note b{display:block;margin-bottom:3px}
.note code{font-family:var(--mono);font-size:11.5px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  color:var(--fg2);font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #1b222c;vertical-align:top}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#182029}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--fg2)}
.pill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:10.5px;
  border:1px solid var(--line);color:var(--fg2);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#1f4d2a}
.pill.bad{color:var(--danger);border-color:#5a2320}
.pill.warn{color:var(--warn);border-color:#4d411a}
.pill.risk-low{color:var(--ok);border-color:#1f4d2a}
.pill.risk-medium{color:var(--warn);border-color:#4d411a}
.pill.risk-high{color:var(--danger);border-color:#5a2320}

/* ───────── log ───────── */
.logwrap{background:#0a0d12;border:1px solid var(--line);border-radius:9px;
  max-height:min(62vh,560px);min-height:280px;overflow:auto;padding:2px 0;
  font-family:var(--mono);font-size:11.5px}
.logline{display:grid;grid-template-columns:88px 132px 78px 1fr;gap:11px;
  padding:3px 12px;border-bottom:1px solid #131922;white-space:pre-wrap;
  word-break:break-word}
.logline.error{background:#1e1211;color:#f0a29c}
.logline.warning,.logline.warnline{color:#e8cf88;background:#1a1810}
.logline .t{color:var(--fg3)}
.logline .m{color:var(--accent)}
.logline .s{color:var(--fg2)}
.progress{height:10px;background:var(--bg3);border-radius:99px;overflow:hidden;
  margin:0;border:1px solid var(--line);position:relative}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2a8cff,#5ec4ff,#8ee4ff);
  transition:width .4s ease;width:0;border-radius:99px;box-shadow:0 0 12px rgba(42,140,255,.45)}
.progress.indet i{width:40%;animation:slide 1.2s ease-in-out infinite}
.job-progress-card{background:linear-gradient(180deg,var(--bg2),#0d1118);
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0 14px}
.job-progress-card h3{margin:0 0 12px;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between}
.job-progress-card h3 .phase-pill{font-size:10px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 9px;border-radius:99px;background:#1a2a40;color:#7ec8ff}
.job-phase-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.job-phase{padding:5px 10px;border-radius:99px;font-size:10px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);
  border:1px solid var(--line);background:var(--bg3)}
.job-phase.active{color:#7ec8ff;border-color:#2a5080;background:#121c2a}
.job-phase.done{color:var(--ok);border-color:#1f4a2c;background:#101a12}
.job-statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.job-stat{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.job-stat .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3)}
.job-stat .val{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:4px;color:var(--fg)}
.job-stat .sub{font-size:10px;color:var(--fg2);margin-top:2px}
.job-progress-meta{display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;font-size:11.5px;margin-top:10px}
.job-progress-meta .pct{font-family:var(--mono);font-weight:700;color:var(--fg);font-size:22px}
.job-progress-meta .eta{font-family:var(--mono);color:var(--accent);text-align:right;font-size:12px}
.job-progress-detail{font-size:11.5px;color:var(--fg2);margin-top:6px}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

/* ───────── modal ───────── */
.modal{position:fixed;inset:0;background:rgba(5,8,12,.72);z-index:100;
  display:none;place-items:center;padding:24px}
.modal.open{display:grid}
.modalbox{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;
  width:min(760px,100%);max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modalhead{padding:15px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px}
.modalhead h3{font-size:14px;flex:1}
.modalbody{flex:1;overflow:auto;padding:0}
.modalfoot{padding:13px 18px;border-top:1px solid var(--line);
  display:flex;gap:10px;align-items:center}
.pathbar{padding:10px 18px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;color:var(--fg2);
  display:flex;gap:8px;align-items:center;background:var(--bg3)}
.pathbar input{flex:1;font-family:var(--mono);font-size:11.5px;padding:5px 9px}
.fsrow{display:flex;align-items:center;gap:10px;padding:7px 18px;cursor:pointer;
  font-size:12.5px;border-bottom:1px solid #1b222c}
.fsrow:hover{background:var(--bg3)}
.fsrow .ic{width:17px;text-align:center;color:var(--fg3);flex:none}
.fsrow .nm{flex:1;word-break:break-all}
.fsrow .sz{color:var(--fg3);font-family:var(--mono);font-size:11px}
.fsrow.dir .ic{color:var(--warn)}
.fsrow.case .ic,.fsrow.container .ic{color:var(--accent)}

footer{background:var(--bg2);border-top:1px solid var(--line);padding:7px 16px;
  font-size:11.5px;color:var(--fg3);display:flex;gap:16px;align-items:center;
  font-family:var(--mono)}
footer .spacer{flex:1}
.empty{padding:44px;text-align:center;color:var(--fg3)}
.empty b{display:block;color:var(--fg2);font-size:14.5px;margin-bottom:7px;
  font-family:var(--sans)}
.spin{width:14px;height:14px;border:2px solid var(--line2);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block}
.scan-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;margin-bottom:12px;background:var(--bg2);
  border:1px solid var(--line);border-radius:8px;font-size:11.5px}
.scan-bar .stages{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.scan-stage{padding:3px 8px;border-radius:99px;background:var(--bg3);
  color:var(--fg3);font-family:var(--mono);font-size:10px}
.scan-stage.done{color:var(--ok);border:1px solid #1a3d2a}
.scan-stage.running{color:var(--accent);border:1px solid #1a3550}
.scan-stage.error{color:var(--danger)}
.transport-pill{font-size:9.5px;font-weight:700;letter-spacing:.06em;
  padding:2px 7px;border-radius:99px;background:var(--bg3);
  color:var(--fg2);margin-left:6px;text-transform:uppercase}
.transport-pill.adb{color:#7ec8ff}
.transport-pill.mtp{color:#e8cf88}
.transport-pill.usbmux{color:#c8a0ff}
.method-pill{font-size:10px;padding:2px 8px;border-radius:99px;
  background:#1a2a1a;color:var(--ok);margin-left:6px}
.card .action-line{margin-top:8px;padding:8px 10px;border-radius:7px;
  background:var(--bg3);font-size:12px;color:var(--fg2)}
.card .vendor-hints{margin-top:8px;font-size:11px;color:var(--fg3)}
.card .vendor-hints summary{cursor:pointer;color:var(--fg2)}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{width:100%;height:100%;border:0;display:block}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.finding{background:var(--bg2);border:1px solid var(--line);border-left:4px solid;
  border-radius:9px;padding:14px 16px;margin-bottom:12px}
.finding.critical{border-left-color:var(--danger)}
.finding.high{border-left-color:#e08b2f}
.finding.medium{border-left-color:var(--accent)}
.finding.low,.finding.info{border-left-color:var(--fg3)}
.fhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.fhead h3{font-size:13.5px;flex:1;font-weight:600}
.sevtag{font-size:9.5px;font-weight:700;letter-spacing:.07em;padding:3px 8px;
  border-radius:99px;color:#0b0e13}
.sevtag.critical{background:var(--danger);color:#fff}
.sevtag.high{background:#e08b2f}
.sevtag.medium{background:var(--accent)}
.sevtag.low,.sevtag.info{background:var(--fg3)}
.finding .why{color:var(--fg);font-size:12.5px;margin:7px 0}
.finding .detail{color:var(--fg2);font-size:12.5px}
.finding .caveat{margin-top:9px;padding:8px 11px;border-radius:7px;
  background:#1c1810;border:1px solid #4d411a;color:#e8cf88;font-size:11.5px}
.finding .fev{margin:8px 0 0 16px;font-size:11.5px;color:var(--fg2)}
.finding .fmeta{margin-top:8px;font-size:11px;color:var(--fg3);
  font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap}
.sevbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sevbox{flex:1;min-width:110px;background:var(--bg2);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px}
.sevbox .n{font-size:24px;font-weight:600;font-family:var(--mono)}
.sevbox .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--fg3)}

/* ───────── toast / banner / modal prompt ───────── */
#toastHost{position:fixed;top:62px;right:16px;z-index:9000;display:flex;
  flex-direction:column;gap:8px;max-width:420px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:12.5px;box-shadow:0 8px 28px rgba(0,0,0,.45);
  pointer-events:auto;animation:toastIn .25s ease}
.toast.ok{border-color:#1f4d2a}
.toast.warn{border-color:#4d411a}
.toast.bad{border-color:#5a2320}
.toast .ttl{font-weight:600;margin-bottom:3px}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#sysBanner{background:#221c0e;border-bottom:1px solid #4d411a;color:var(--warn);
  padding:8px 16px;font-size:12px;display:none}
#sysBanner.show{display:flex;align-items:center;gap:12px}
#sysBanner .spacer{flex:1}
#navToggle{display:none}
.workflow-chip{font-size:10px;color:var(--fg3);margin-left:8px}

#palette{display:none;position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.45);
  place-items:start center;padding-top:12vh}
#palette.open{display:grid}
#palette .box{width:min(560px,92vw);background:var(--bg2);border:1px solid var(--line2);
  border-radius:12px;overflow:hidden}
#palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--bg3);
  padding:12px 14px;font-family:var(--mono);font-size:13px}
#palette .hit{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;
  cursor:pointer;color:var(--fg2);font-size:13px}
#palette .hit:hover,#palette .hit.on{background:var(--bg3);color:var(--fg)}
#palette .hit kbd{font:10px var(--mono);color:var(--fg3)}


/* ───────── responsive ───────── */
@media (max-width: 960px) {
  #navToggle{display:inline-flex}
  .body{grid-template-columns:1fr}
  nav{position:fixed;inset:52px auto 0 0;width:min(280px,88vw);z-index:800;
    transform:translateX(-105%);transition:transform .25s ease;
    box-shadow:8px 0 24px rgba(0,0,0,.35)}
  nav.open{transform:none}
  .job-statgrid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 640px) {
  .pane{padding:18px 16px}
  header{gap:10px;padding:0 12px}
  .job-statgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <div id="sysBanner"><span id="sysBannerMsg"></span><span class="spacer"></span>
    <button class="btn sm" id="sysBannerDismiss">Dismiss</button></div>
  <header>
    <button class="btn sm" id="navToggle" title="Menu">☰</button>
    <div class="brand">ARGUS <em>God-level</em><em id="buildTag"></em></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="hdr-right" id="hdrRight"></div>
  </header>

  <div class="body">
    <nav id="nav"></nav>
    <main id="main"><div class="empty"><span class="spin"></span></div></main>
  </div>

  <footer>
    <span id="fstat">Starting…</span>
    <span class="spacer"></span>
    <span id="fenv"></span>
  </footer>
</div>

<div id="toastHost"></div>
<div id="palette">
  <div class="box">
    <input id="paletteQ" placeholder="Jump to…  extract, findings, scan, verify" spellcheck="false">
    <div id="paletteHits"></div>
  </div>
</div>

<div class="modal" id="promptModal">
  <div class="modalbox" style="max-width:480px">
    <div class="modalhead">
      <h3 id="promptTitle">Confirm</h3>
      <button class="btn sm" id="promptCancel">Cancel</button>
    </div>
    <div class="modalbody" style="padding:16px">
      <p id="promptText" style="margin-bottom:12px;color:var(--fg2)"></p>
      <input id="promptInput" type="text" style="display:none">
      <textarea id="promptArea" style="display:none;min-height:90px"></textarea>
    </div>
    <div class="modalfoot">
      <span class="spacer"></span>
      <button class="btn primary" id="promptOk">OK</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h3 id="modalTitle">Choose a folder</h3>
      <button class="btn sm" onclick="closeModal()">Close</button>
    </div>
    <div class="pathbar">
      <button class="btn sm" id="fsUp">↑ Up</button>
      <input id="fsPath" spellcheck="false" placeholder="Type or paste a path…">
      <button class="btn sm" id="fsGo">Go</button>
    </div>
    <div class="modalbody" id="fsBody"></div>
    <div class="modalfoot">
      <span class="mono" id="fsSel" style="flex:1;color:var(--fg3)"></span>
      <button class="btn primary" id="fsPick">Use this folder</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════ plumbing ═══════════════════════ */
const TOKEN = (() => {
  const fromHash = (location.hash.match(/token=([^&]+)/) || [])[1] || "";
  if (fromHash) {
    try { sessionStorage.setItem("argus_token", fromHash); } catch (_) {}
    if (location.hash) history.replaceState(null, "", location.pathname);
    return fromHash;
  }
  try { return sessionStorage.getItem("argus_token") || ""; } catch (_) { return ""; }
})();

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function toast(message, opts = {}) {
  const host = $("#toastHost");
  if (!host) return;
  const type = opts.type || "info";
  const box = el("div", `toast ${type}`);
  box.innerHTML = opts.title
    ? `<div class="ttl">${esc(opts.title)}</div>${esc(message)}`
    : esc(message);
  host.appendChild(box);
  setTimeout(() => box.remove(), opts.duration || 4500);
}

function showPrompt({ title, text, placeholder = "", multiline = false, password = false }) {
  return new Promise(resolve => {
    const modal = $("#promptModal");
    $("#promptTitle").textContent = title || "Confirm";
    $("#promptText").textContent = text || "";
    const input = multiline ? $("#promptArea") : $("#promptInput");
    const other = multiline ? $("#promptInput") : $("#promptArea");
    input.style.display = "";
    other.style.display = "none";
    input.value = "";
    input.placeholder = placeholder;
    input.type = password ? "password" : (multiline ? "text" : "text");
    const done = (val) => { modal.classList.remove("open"); resolve(val); };
    $("#promptOk").onclick = () => done(input.value);
    $("#promptCancel").onclick = () => done(null);
    modal.classList.add("open");
    input.focus();
    input.onkeydown = e => { if (e.key === "Enter" && !multiline) done(input.value); };
  });
}

function saveLastCase(path, protectedCase) {
  try {
    localStorage.setItem("argus_last_case", JSON.stringify({
      path, protected: !!protectedCase, at: Date.now(),
    }));
  } catch (_) {}
}

function relativeTime(iso) {
  if (!iso) return "";
  const sec = Math.round((Date.now() - Date.parse(iso)) / 1000);
  if (sec < 60) return `${sec}s ago`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
  return `${Math.floor(sec / 3600)}h ago`;
}

const LOCK_HINTS = {
  exhibit: "Open or create a case first",
  device: "Register and select an exhibit first (Step 3)",
  extract: "Register an exhibit before extraction",
  analyse: "Complete an extraction to unlock analysis",
  findings: "Run intelligence screening first",
  report: "Generate a report first",
};

function hasExhibits() {
  return (S.caseOverview?.exhibits || []).length > 0;
}

function workflowNext() {
  if (!S.casePath) return "case";
  if (!hasExhibits() || !S.exhibitId) return "exhibit";
  if (!stepDone("device")) return "device";
  if (!stepDone("extract")) return "extract";
  if (!stepDone("analyse")) return "analyse";
  return "overview";
}

function ensureWorkflowView() {
  if (unlocked(S.view)) return false;
  const next = workflowNext();
  if (next === S.view) return false;
  toast(LOCK_HINTS[S.view] || "Complete earlier workflow steps first",
    { type: "warn", title: "Step " + (STEPS.findIndex(s => s[0] === S.view) + 1) });
  S.view = next;
  renderNav();
  return true;
}

function onGlobalKey(e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    openPalette();
    return;
  }
  if (e.key === "Escape" && $("#palette")?.classList.contains("open")) {
    closePalette();
    return;
  }
  if (e.target.matches("input, textarea, select") && !e.altKey) return;
  if (e.key === "?" && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    toast("Ctrl+K command palette · Alt+1–8 workflow steps · Esc close", {
      title: "Keyboard shortcuts", duration: 6000,
    });
    return;
  }
  if (e.altKey && e.key >= "1" && e.key <= "8") {
    const idx = Number(e.key) - 1;
    const step = STEPS[idx];
    if (step && unlocked(step[0])) {
      e.preventDefault();
      S.view = step[0];
      renderNav();
      route();
      $("#nav")?.classList.remove("open");
    }
  }
}

const PALETTE_ITEMS = [
  ["case", "Open / create case", "1"],
  ["overview", "Case overview", "2"],
  ["exhibit", "Register exhibit", "3"],
  ["device", "Scan & device support", "4"],
  ["extract", "Extract (god-speed)", "5"],
  ["analyse", "Analyse", "6"],
  ["findings", "Findings / lead sheet", "7"],
  ["report", "Report & certificate", "8"],
];

function closePalette() {
  $("#palette")?.classList.remove("open");
}

function openPalette() {
  const pal = $("#palette");
  const box = $("#paletteHits");
  const q = $("#paletteQ");
  if (!pal || !box || !q) return;
  pal.classList.add("open");
  q.value = "";
  const paint = () => {
    const needle = q.value.trim().toLowerCase();
    const hits = PALETTE_ITEMS.filter(it =>
      !needle || it[0].includes(needle) || it[1].toLowerCase().includes(needle));
    box.innerHTML = hits.map((it, i) =>
      `<div class="hit${i===0?" on":""}" data-view="${esc(it[0])}">
        <span>${esc(it[1])}</span><kbd>${esc(it[2] ? "Alt+" + it[2] : "")}</kbd></div>`
    ).join("") || `<div class="hit">No match</div>`;
    box.querySelectorAll(".hit[data-view]").forEach(h => {
      h.onclick = () => {
        const id = h.dataset.view;
        closePalette();
        if (unlocked(id)) { S.view = id; renderNav(); route(); }
        else toast("Complete earlier steps first", { type: "warn" });
      };
    });
  };
  q.oninput = paint;
  q.onkeydown = ev => {
    if (ev.key === "Escape") { closePalette(); }
    if (ev.key === "Enter") {
      const first = box.querySelector(".hit[data-view]");
      first?.click();
    }
  };
  paint();
  q.focus();
}

const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (n ?? 0).toLocaleString();
const human = n => { n = n || 0;
  for (const u of ["B","KB","MB","GB","TB"]) {
    if (n < 1024) return u === "B" ? `${n|0} B` : `${n.toFixed(1)} ${u}`;
    n /= 1024; } return `${n.toFixed(1)} PB`; };

async function api(path, opts, retries = 3) {
  const url = "/api/" + path + (path.includes("?") ? "&" : "?") +
              "token=" + encodeURIComponent(TOKEN);
  let lastErr = null;
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    } catch (e) {
      lastErr = e;
      if (i < retries - 1) await new Promise(r => setTimeout(r, 350 * (i + 1)));
    }
  }
  throw lastErr;
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ ...body, token: TOKEN }) });

/* ═══════════════════════ state ═══════════════════════ */
const S = {
  env: null,
  view: "case",
  casePath: null, caseOverview: null, casePassword: "",
  exhibitId: null,
  device: null,            // detected device, if any
  deviceProfile: null,     // capability overview from the manual
  source: null,            // { path, classification }
  containers: [],          // selected for analysis/report
  job: null, jobSeq: 0, jobTimer: null,
  jobPollBackoff: 250,
  lastAcquirePayload: null,
  lastBatchPayload: null,
  preferredMethod: "",
  lastScanAt: 0,
  autoScanOn: false,
  lastReport: null, intel: null, owner: "",
  resumeContainer: null,
  batchSelected: [],
};

const STEPS = [
  ["case",     "Case",       "Create or open"],
  ["overview", "Overview",   "Case dashboard"],
  ["exhibit",  "Exhibit",    "Register the device"],
  ["device",   "Support",    "Verify capability"],
  ["extract",  "Extract",    "Acquire the data"],
  ["analyse",  "Analyse",    "Review artifacts"],
  ["findings", "Findings",   "Ranked leads"],
  ["report",   "Report",     "Export findings"],
];

function unlocked(view) {
  if (view === "case") return true;
  if (view === "overview") return !!S.casePath;
  if (view === "exhibit") return !!S.casePath;
  if (view === "device") return !!S.casePath && hasExhibits() && !!S.exhibitId;
  if (view === "extract") return !!S.casePath && hasExhibits() && !!S.exhibitId;
  if (view === "analyse" || view === "report" || view === "findings")
    return (S.caseOverview?.extractions || []).length > 0;
  return false;
}
function stepDone(view) {
  if (view === "case") return !!S.casePath;
  if (view === "overview") return !!S.casePath;
  if (view === "exhibit") return (S.caseOverview?.exhibits || []).length > 0;
  if (view === "device") return !!S.deviceProfile || !!S.source;
  if (view === "extract") return (S.caseOverview?.extractions || []).length > 0;
  if (view === "analyse") return S.containers.length > 0;
  if (view === "findings") return !!S.intel;
  if (view === "report") return !!S.lastReport;
  return false;
}

/* ═══════════════════════ boot ═══════════════════════ */
(async function boot() {
  if (!TOKEN) {
    $("#main").innerHTML = `<div class="pane"><div class="note bad">
      <b>Session token missing</b>
      This page must be opened by the ARGUS launcher so it can present its
      session token. Close this tab and run the launcher again.</div></div>`;
    return;
  }
  try {
    S.env = await api("env");
    $("#fenv").textContent =
      `ARGUS ${S.env.version} god-level · build ${S.env.build || "unidentified"} · ` +
      `Python ${S.env.python} · Ctrl+K`;
    // Shown in the header too. With several extracted copies on different
    // drives there is otherwise no way to tell from the screen which one is
    // running, and a fixed bug gets re-reported from a stale folder.
    const tag = $("#buildTag");
    if (tag) {
      tag.textContent = S.env.build ? `build ${S.env.build}` : "";
      tag.title = "Installation build ID — quote this when reporting a problem, "
                + "and check it matches the release you meant to run.";
    }
    const sc = S.env.selfcheck || {};
    const banner = $("#sysBanner");
    if (banner && sc.ok === false) {
      $("#sysBannerMsg").textContent =
        `Installation modified — ${sc.mismatch_count || 0} file(s) differ from the release manifest.`;
      banner.classList.add("show");
      $("#sysBannerDismiss").onclick = () => banner.classList.remove("show");
    }
    try {
      S.autoScanOn = sessionStorage.getItem("argus_autoscan") === "1";
    } catch (_) {}
    $("#navToggle")?.addEventListener("click", () =>
      $("#nav").classList.toggle("open"));
    document.addEventListener("keydown", onGlobalKey);
    renderNav(); renderHeader();
    await resumeRunningJob();
    await route();
  } catch (e) {
    $("#main").innerHTML = `<div class="pane"><div class="note bad">
      <b>Could not reach the ARGUS service</b>${esc(e.message)}</div></div>`;
  }
})();

async function resumeRunningJob() {
  try {
    const data = await api("jobs?limit=10");
    const running = (data.jobs || []).find(j => j.status === "running");
    if (!running) return;
    S.view = running.kind === "acquire" || running.kind === "batch"
      ? "extract" : S.view;
    toast(`Resuming job: ${running.label || running.kind}`, { type: "warn" });
    renderNav();
    const mount = running.kind === "batch" ? "runBlock" : "runBlock";
    setTimeout(() => {
      if ($("#" + mount)) watchJob(running.id, mount, async () => {
        await refreshCase();
        S.containers = (S.caseOverview?.extractions || []).map(x => x.path);
      });
    }, 300);
  } catch (_) {}
}

function renderNav() {
  const nav = $("#nav");
  nav.innerHTML = "";
  nav.appendChild(el("div", "navhead", "Workflow"));
  STEPS.forEach(([id, label, sub], i) => {
    const ok = unlocked(id);
    const d = el("div", "step" + (S.view === id ? " active" : "") +
                         (stepDone(id) ? " done" : "") + (ok ? "" : " locked"));
    d.innerHTML = `<span class="num">${stepDone(id) ? "✓" : i + 1}</span>
      <span><span>${esc(label)}</span><small>${esc(sub)}</small></span>`;
    if (ok) d.onclick = () => { S.view = id; renderNav(); route(); };
    else d.title = LOCK_HINTS[id] || "Complete earlier steps first";
    nav.appendChild(d);
  });
  const doneCount = STEPS.filter(([id]) => stepDone(id)).length;

  nav.appendChild(el("div", "navhead", "Environment"));
  const wf = el("div", "step");
  wf.style.cursor = "default";
  wf.innerHTML = `<span class="num" style="border-color:var(--accent);color:var(--accent)">${
    doneCount}</span><span><span>Workflow</span><small>${
    doneCount}/${STEPS.length} steps complete</small></span>`;
  nav.appendChild(wf);

  const t = S.env?.toolchain || {};
  const tool = (name, info, why) => {
    const d = el("div", "step");
    d.style.cursor = "default";
    d.innerHTML = `<span class="num" style="border-color:${
        info?.available ? "var(--ok)" : "var(--line2)"};color:${
        info?.available ? "var(--ok)" : "var(--fg3)"}">${
        info?.available ? "✓" : "–"}</span>
      <span><span>${esc(name)}</span><small>${
        info?.available ? "available" : esc(why)}</small></span>`;
    nav.appendChild(d);
  };
  tool("adb", t.adb, "Android live extraction off");
  tool("libimobiledevice", t.libimobiledevice, "iOS live extraction off");
  const missing = Object.entries(S.env?.capabilities || {})
    .filter(([, v]) => !v.available);
  if (missing.length) {
    const d = el("div", "step");
    d.style.cursor = "default";
    d.innerHTML = `<span class="num" style="color:var(--warn);
      border-color:#4d411a">!</span><span><span>Optional features</span>
      <small>${missing.length} unavailable — see Report step</small></span>`;
    nav.appendChild(d);
  }
}

function renderHeader() {
  const c = $("#crumbs");
  const bits = [];
  if (S.caseOverview) bits.push(`Case <b>${esc(S.caseOverview.case_id)}</b>`);
  if (S.exhibitId) bits.push(`Exhibit <b>${esc(S.exhibitId)}</b>`);
  if (S.caseOverview?.total_artifacts)
    bits.push(`Artifacts <b>${num(S.caseOverview.total_artifacts)}</b>`);
  c.innerHTML = bits.join("") ||
    `<span style="color:var(--fg3)">No case open</span>`;

  const r = $("#hdrRight");
  r.innerHTML = "";
  const god = el("div", "chip ok");
  god.title = "Ctrl+K command palette";
  god.style.cursor = "pointer";
  god.innerHTML = `<span class="dot"></span>God-level v${esc(S.env?.version || "1.1")}`;
  god.onclick = () => openPalette();
  r.appendChild(god);
  const sc = S.env?.selfcheck;
  if (sc) {
    const chip = el("div", "chip " + (sc.ok ? "ok" : "warn"));
    chip.title = sc.ok ? "Installation verified against release manifest"
      : `${sc.mismatch_count || 0} modified file(s)`;
    chip.innerHTML = `<span class="dot"></span>${
      sc.ok ? "Install verified" : "Modified build"}`;
    r.appendChild(chip);
  }
  if (S.caseOverview) {
    const valid = S.caseOverview.audit_chain_valid;
    const chip = el("div", "chip " + (valid ? "ok" : "bad"));
    chip.innerHTML = `<span class="dot"></span>${
      valid ? "Custody chain intact" : "CUSTODY CHAIN BROKEN"}`;
    r.appendChild(chip);
  }
  if (S.job && S.job.status === "running") {
    const chip = el("div", "chip warn");
    chip.style.cursor = "pointer";
    chip.title = "Click to watch live progress";
    const pct = S.jobProgress ? ` ${Math.round(S.jobProgress)}%` : "";
    const eta = S.job.eta_seconds ? ` · ~${formatDuration(S.job.eta_seconds)} left` : "";
    chip.innerHTML = `<span class="spin"></span>${esc(S.job.label || "working")}${pct}${eta}`;
    chip.onclick = () => { S.view = "extract"; renderNav(); route(); };
    r.appendChild(chip);
  }
  if (S.deviceHealth) {
    const h = S.deviceHealth;
    const chip = el("div", "chip " + (h.ok ? "ok" : "warn"));
    chip.title = h.detail || "";
    chip.innerHTML = `<span class="dot"></span>${esc(h.label || "Device")}`;
    r.appendChild(chip);
  }
}

async function route() {
  renderHeader();
  if (ensureWorkflowView()) return route();
  const m = $("#main");
  if (S.view !== "analyse") m.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try {
    const views = { case: viewCase, overview: viewOverview, exhibit: viewExhibit,
      device: viewDevice, extract: viewExtract, analyse: viewAnalyse,
      findings: viewFindings, report: viewReport };
    await views[S.view](m);
  } catch (e) {
    m.innerHTML = `<div class="pane"><div class="note bad"><b>Error</b>${
      esc(e.message)}</div></div>`;
  }
}
function setStat(t) { $("#fstat").textContent = t; }

/* ═══════════════════════ 1 · CASE ═══════════════════════ */
async function viewCase(m) {
  const dir = S.env.workspace + (S.env.workspace.includes("\\") ? "\\cases" : "/cases");
  let listing = { cases: [] };
  try { listing = await api("cases?dir=" + encodeURIComponent(dir)); } catch (_) {}

  m.innerHTML = `<div class="pane">
    <h1>Case</h1>
    <div class="lede">A case holds the exhibits you seize and every extraction
      taken from them. The Case ID, investigator and location are part of the
      chain of custody, so they are recorded before any evidence is touched.
      <span class="mono" style="display:block;margin-top:6px;color:var(--fg3)">
      Lab manual §5.2, Steps 3–5</span></div>

    <h2>Create a new case</h2>
    <div class="grid">
      <div class="field"><label>Case ID</label>
        <input id="cId" value="${esc(S.env.suggested_case_id)}" spellcheck="false">
        <span class="help">A timestamp-based ID is suggested; edit it to match
          your reference if you prefer.</span></div>
      <div class="field"><label>Investigating officer</label>
        <input id="cInv" placeholder="e.g. A. Sharma"></div>
      <div class="field"><label>Organisation</label>
        <input id="cOrg" placeholder="e.g. State Cyber Cell"></div>
      <div class="field"><label>Case password <span class="help"
        style="display:inline">(optional)</span></label>
        <input id="cPw" type="password" placeholder="Leave blank for none">
        <span class="help">Gates access through this tool. It is not
          encryption at rest — do not treat it as such.</span></div>
    </div>
    <div class="field" style="margin-top:14px"><label>Save location</label>
      <div class="inline"><input id="cDir" value="${esc(dir)}" spellcheck="false">
        <button class="btn" id="cBrowse">Browse…</button></div></div>
    <div class="field" style="margin-top:14px"><label>Description</label>
      <textarea id="cDesc" placeholder="Brief description of the matter"></textarea></div>
    <div class="actions">
      <button class="btn primary" id="cCreate">Create case</button>
      <span id="cMsg" class="mono"></span></div>

    <h2>Open an existing case</h2>
    <div id="caseList"></div>
  </div>`;

  $("#cBrowse").onclick = () => openBrowser({
    title: "Choose where to save cases", start: $("#cDir").value,
    onPick: p => $("#cDir").value = p });

  $("#cCreate").onclick = async () => {
    const btn = $("#cCreate"); btn.disabled = true;
    $("#cMsg").textContent = "";
    try {
      const r = await post("case/new", {
        dir: $("#cDir").value.trim(), case_id: $("#cId").value.trim(),
        investigator: $("#cInv").value.trim(),
        organisation: $("#cOrg").value.trim(),
        description: $("#cDesc").value.trim(),
        password: $("#cPw").value });
      S.casePath = r.path; S.caseOverview = r.overview;
      S.casePassword = $("#cPw").value; S.exhibitId = null;
      saveLastCase(r.path, !!$("#cPw").value);
      S.view = hasExhibits() ? "overview" : "exhibit";
      renderNav(); route();
    } catch (e) {
      $("#cMsg").innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
      btn.disabled = false;
    }
  };

  const holder = $("#caseList");
  let lastBanner = "";
  try {
    const last = JSON.parse(localStorage.getItem("argus_last_case") || "null");
    if (last?.path && last.path !== S.casePath) {
      lastBanner = `<div class="note" style="margin-bottom:14px">
        <b>Continue where you left off</b> — last case opened ${relativeTime(new Date(last.at).toISOString())}.
        <div class="actions" style="margin-top:8px">
          <button class="btn primary sm" id="resumeLastCase">Open last case</button>
        </div></div>`;
    }
  } catch (_) {}
  holder.innerHTML = lastBanner;
  if (!listing.cases.length) {
    holder.innerHTML += `<div class="note">No cases found in
      <code>${esc(dir)}</code> yet. Create one above, or browse to another
      location.</div>`;
  } else {
    const cards = el("div", "cards");
    listing.cases.forEach(c => {
      const card = el("div", "card pick" + (S.casePath === c.path ? " sel" : ""));
      card.innerHTML = `<h3>${esc(c.case_id)}
        ${c.protected ? '<span class="pill warn">locked</span>' : ""}
        <span class="pill">${esc(c.status)}</span></h3>
        <dl class="kv">
          <dt>Created</dt><dd>${esc((c.created_at || "").slice(0, 19))}</dd>
          <dt>Investigator</dt><dd>${esc(c.investigator || "—")}</dd>
          <dt>Exhibits</dt><dd>${c.exhibits}</dd>
        </dl>`;
      card.onclick = () => openCase(c.path, c.protected);
      cards.appendChild(card);
    });
    holder.appendChild(cards);
  }
  $("#resumeLastCase")?.addEventListener("click", async () => {
    try {
      const last = JSON.parse(localStorage.getItem("argus_last_case") || "null");
      if (last?.path) await openCase(last.path, last.protected);
    } catch (_) {}
  });
  setStat(`${listing.cases.length} case(s) in ${dir}`);
}

async function openCase(path, needsPassword) {
  let pw = "";
  if (needsPassword) {
    pw = await showPrompt({
      title: "Case password",
      text: "This case is protected. Enter the password to open it.",
      placeholder: "Password", password: true,
    });
    if (pw === null) return;
  }
  try {
    const ov = await api("case?path=" + encodeURIComponent(path) +
                         "&password=" + encodeURIComponent(pw));
    S.casePath = path; S.caseOverview = ov; S.casePassword = pw;
    S.exhibitId = ov.exhibits[0]?.exhibit_id || null;
    S.containers = (ov.extractions || []).map(x => x.path);
    saveLastCase(path, needsPassword);
    S.view = hasExhibits() ? "overview" : "exhibit";
    renderNav(); route();
    toast(`Opened case ${ov.case_id}`, { type: "ok" });
  } catch (e) { toast("Could not open the case: " + e.message, { type: "bad" }); }
}

async function refreshCase() {
  if (!S.casePath) return;
  S.caseOverview = await api("case?path=" + encodeURIComponent(S.casePath) +
                             "&password=" + encodeURIComponent(S.casePassword));
  renderNav(); renderHeader();
}

function openAnalysis(extra) {
  if (!S.containers.length) {
    toast("Select at least one extraction.", { type: "warn" });
    return;
  }
  const q = new URLSearchParams({ token: TOKEN,
                                  containers: S.containers.join("\n") });
  if (extra?.artifact) q.set("artifact", extra.artifact);
  if (extra?.query) q.set("q", extra.query);
  const picked = (S.caseOverview?.extractions || [])
    .filter(x => S.containers.includes(x.path));
  const names = picked.map(x => x.exhibit_id || x.name).join(", ")
    || `${S.containers.length} container(s)`;
  const dev = picked[0] || {};
  const device = [dev.device_make, dev.device_model].filter(Boolean).join(" ");
  const arts = picked.reduce((a, x) => a + (x.artifact_count || 0), 0);
  $("#main").innerHTML = `<div class="pane flush" style="display:flex;flex-direction:column;height:100%">
    <div style="display:flex;gap:10px;padding:8px 14px;background:var(--bg2);
                border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap">
      <button class="btn sm" id="leaveAnalysis">← Back to workflow</button>
      <span style="color:var(--fg2)"><b>Analysis</b> — ${esc(names)}</span>
      ${device ? `<span class="chip" style="font-size:11px">${esc(device)}</span>` : ""}
      ${arts ? `<span class="chip ok" style="font-size:11px">${arts.toLocaleString()} artifacts</span>` : ""}
      <span class="spacer" style="flex:1"></span>
      <span class="chip ok" style="font-size:11px">Horizon command center · FTS · tagged</span>
    </div>
    <iframe src="/analyst.html?${q}" style="flex:1;border:0;width:100%;min-height:0"></iframe>
  </div>`;
  $("#leaveAnalysis").onclick = () => route();
  setStat(`Analysing ${names}`);
}

    <div class="actions" style="margin-bottom:10px">
      <button class="btn sm" id="devWatch">Watch USB (2 min)</button>
      <button class="btn sm" id="devWatchStop" disabled>Stop watching</button>
      <button class="btn primary sm" id="devScan">Scan devices</button>
      <button class="btn sm" id="devScanDeep">Deep scan</button>
      <button class="btn sm" id="devScanRefresh">Restart adb & scan</button>
      <button class="btn sm" id="devAutoScan">Auto-scan: off</button>
      <button class="btn primary sm" id="devBatch" disabled>Batch extract selected</button>
      <button class="btn sm" id="devBatchAll">Extract all connected</button>
      <span class="mono" id="devWatchStat" style="font-size:11px;color:var(--fg3)"></span>
    </div>
    <div id="devScanBar" class="scan-bar" style="display:none"></div>
    <div id="devWatchLog" style="max-height:120px;overflow:auto;font-size:11px;
      margin-bottom:12px;display:none"></div>
    <div id="devPanel"><span class="spin"></span></div>

    <h2>Device manual</h2>
    <div class="inline" style="max-width:520px">
      <input id="dQ" placeholder="Search a model, e.g. iPhone 12 mini"
        value="${esc(guess)}" spellcheck="false">
      <button class="btn" id="dSearch">Search</button></div>
    <div id="dResults" style="margin-top:14px"></div>
    <div id="dMatrix"></div>
    <div class="actions">
      <button class="btn primary" id="dNext">Continue to extraction →</button>
    </div>
  </div>`;

  $("#dNext").onclick = () => { stopDeviceWatch(); stopAutoScan(); S.view = "extract"; renderNav(); route(); };
  $("#dSearch").onclick = () => searchManual($("#dQ").value);
  $("#dQ").onkeydown = e => { if (e.key === "Enter") searchManual($("#dQ").value); };

  let watchTimer = null;
  let autoScanTimer = null;
  const stopAutoScan = () => {
    clearInterval(autoScanTimer);
    autoScanTimer = null;
    S.autoScanOn = false;
    try { sessionStorage.setItem("argus_autoscan", "0"); } catch (_) {}
    const btn = $("#devAutoScan");
    if (btn) btn.textContent = "Auto-scan: off";
  };
  const startAutoScan = () => {
    stopAutoScan();
    S.autoScanOn = true;
    try { sessionStorage.setItem("argus_autoscan", "1"); } catch (_) {}
    const btn = $("#devAutoScan");
    if (btn) btn.textContent = "Auto-scan: on (12s)";
    autoScanTimer = setInterval(() => refreshDevices({ deep: false, quiet: true }), 12000);
  };
  const stopDeviceWatch = () => {
    clearInterval(watchTimer);
    watchTimer = null;
    const stop = $("#devWatchStop");
    const watch = $("#devWatch");
    if (stop) stop.disabled = true;
    if (watch) watch.disabled = false;
  };
  const renderWatchEvents = (events) => {
    const log = $("#devWatchLog");
    if (!log || !events.length) return;
    log.style.display = "";
    events.forEach(ev => {
      const d = el("div", "logline " + (ev.kind === "disconnected" ? "warning" : "info"));
      d.textContent = `${(ev.ts || "").slice(11, 19)}  ${ev.message}`;
      log.appendChild(d);
    });
    log.scrollTop = log.scrollHeight;
  };
  $("#devWatch").onclick = async () => {
    $("#devWatchLog").innerHTML = "";
    $("#devWatchLog").style.display = "";
    $("#devWatch").disabled = true;
    $("#devWatchStop").disabled = false;
    await api("watch?reset=1");
    const started = Date.now();
    const pollWatch = async () => {
      try {
        const w = await api("watch");
        renderWatchEvents(w.events || []);
        $("#devWatchStat").textContent =
          `${w.count} device(s) · ${(w.history || []).length} event(s)`;
        if (w.devices.length) {
          S.device = w.devices[0];
          await refreshDevices();
        }
      } catch (_) {}
    };
    pollWatch();
    watchTimer = setInterval(pollWatch, 1500);
    setTimeout(() => { stopDeviceWatch(); }, 120000);
  };
  $("#devWatchStop").onclick = stopDeviceWatch;

  const startBatchExtraction = async ({ allConnected }) => {
    if (!S.casePath) {
      toast("Open a case before starting a batch extraction.", { type: "warn" });
      return;
    }
    const op = (S.caseOverview?.investigator || "").trim()
      || await showPrompt({
        title: "Batch operator",
        text: "Enter the operator name for this batch extraction.",
        placeholder: "Operator name",
      });
    if (!op) return;
    const btnAll = $("#devBatchAll");
    const btnSel = $("#devBatch");
    if (btnAll) btnAll.disabled = true;
    if (btnSel) btnSel.disabled = true;
    try {
      const devices = allConnected ? [] : S.batchSelected.map(serial => {
        const d = (S.connectedDevices || []).find(x => x.serial === serial) || {};
        const method = d.raw?.recommended_method
          || (d.transport === "mtp" ? "mtp" : "comprehensive");
        return {
          serial,
          device_name: d.name || d.model || serial,
          transport: d.transport || "",
          mtp_name: d.raw?.mtp_name || d.name || d.model || "",
          make: d.make || "",
          model: d.marketing_name || d.model || "",
          imei: d.imei || "",
          method,
        };
      });
      const hasMtp = devices.some(d => d.method === "mtp");
      const hasIncomplete = (S.caseOverview?.extractions || [])
        .some(x => x.incomplete);
      try { sessionStorage.setItem("argus_operator", op); } catch (_) {}
      const batchBody = {
        case_path: S.casePath, password: S.casePassword,
        operator: op, method: hasMtp ? "mtp" : "comprehensive",
        turbo: true,
        all_connected: allConnected, devices: devices.map(d => ({
          ...d, resume: hasIncomplete,
        })),
        auto_register_exhibits: true, time_span: "all",
        recover_deleted: true };
      S.lastBatchPayload = batchBody;
      const r = await post("acquire/batch", batchBody);
      S.view = "extract";
      renderNav();
      route();
      watchJob(r.job_id, "runBlock", async () => {
        await refreshCase();
        S.containers = (S.caseOverview.extractions || []).map(x => x.path);
        S.batchSelected = [];
        syncBatchButtons();
      });
    } catch (e) {
      toast(e.message || String(e), { type: "bad" });
      syncBatchButtons();
    }
  };

  $("#devBatch").onclick = () => startBatchExtraction({ allConnected: false });
  $("#devBatchAll").onclick = () => startBatchExtraction({ allConnected: true });
  $("#devScan").onclick = () => refreshDevices({ deep: false });
  $("#devScanDeep").onclick = () => refreshDevices({ deep: true });
  $("#devScanRefresh").onclick = () => refreshDevices({ deep: true, refreshAdb: true });
  $("#devAutoScan").onclick = () => { S.autoScanOn ? stopAutoScan() : startAutoScan(); };
  if (S.autoScanOn) startAutoScan();
  syncBatchButtons();

  refreshDevices({ deep: false });
  if (guess) searchManual(guess);
  setStat("Verify device support before connecting the handset");
}

function renderScanBar(scan) {
  const bar = $("#devScanBar");
  if (!bar || !scan) { if (bar) bar.style.display = "none"; return; }
  const stages = (scan.stages || []).map(s =>
    `<span class="scan-stage ${esc(s.status)}">${esc(s.label)}`
    + (s.count ? ` (${s.count})` : "")
    + (s.elapsed_ms ? ` ${s.elapsed_ms}ms` : "") + `</span>`
  ).join("");
  const transports = Object.entries(scan.by_transport || {})
    .map(([k, v]) => `${k}:${v}`).join(" · ");
  bar.style.display = "";
  bar.innerHTML = `<span class="spin"></span>`
    + `<span><b>${scan.elapsed_ms}ms</b> · ${scan.physical_devices || 0} device(s)`
    + (scan.merged_from > scan.physical_devices
      ? ` (merged ${scan.merged_from})` : "")
    + (transports ? ` · ${esc(transports)}` : "") + `</span>`
    + `<span class="stages">${stages}</span>`;
}

function deviceTransportBadges(d) {
  const transports = d.raw?.transports || [d.transport];
  return transports.map(t =>
    `<span class="transport-pill ${esc(t)}">${esc(t)}</span>`).join("");
}

      onclick="event.stopPropagation()"><input type="checkbox" class="batch-cb"
      data-serial="${esc(d.serial)}" ${
      S.batchSelected.includes(d.serial) ? "checked" : ""}> batch</label>` : ""}
    <h3>${esc(d.name || d.model || d.serial)}
      ${deviceTransportBadges(d)}
      ${method ? `<span class="method-pill">${esc(method)}</span>` : ""}
      ${!ready
        ? `<span class="pill bad">${esc(d.raw?.adb_state || "not ready")}</span>`
        : d.trusted ? '<span class="pill ok">trusted</span>'
                    : '<span class="pill warn">not paired</span>'}</h3>
    <dl class="kv">
      <dt>Serial</dt><dd class="mono" style="font-size:10px;word-break:break-all">${
        esc(d.serial)}</dd>
      <dt>OS</dt><dd>${esc(d.os_family)} ${esc(d.os_version || "")}</dd>

      <dt>IMEI</dt><dd>${esc(d.imei || "—")}</dd>
      <dt>USB</dt><dd>${esc(
        [d.raw?.usb_vendor, d.raw?.usb_vid && ("VID_" + String(d.raw.usb_vid).toUpperCase()),
         d.raw?.usb_pid && ("PID_" + String(d.raw.usb_pid).toUpperCase()),
         d.raw?.usb_mode].filter(Boolean).join(" · ") || "—")}</dd>
      ${(d.raw?.volumes || []).length
        ? `<dt>Volumes</dt><dd>${esc((d.raw.volumes || []).join(", "))}</dd>` : ""}
      ${d.raw?.identity?.security_patch
        ? `<dt>Patch</dt><dd>${esc(d.raw.identity.security_patch)}</dd>` : ""}
      <dt>Root</dt><dd>${d.rooted ? "yes" : "no"}</dd>
      <dt>Battery</dt><dd>${d.battery == null ? "—" : d.battery + "%"}</dd>
    </dl>
    ${d.raw?.recommended_action
      ? `<div class="action-line">${esc(d.raw.recommended_action)}</div>` : ""}
    ${d.raw?.meaning ? `<div style="margin:8px 0 0"><b>${
      esc(d.raw.meaning)}</b></div>` : ""}
    ${d.raw?.hint ? `<div class="note warn" style="margin:6px 0 0">${
      esc(d.raw.hint)}</div>` : ""}
    ${(d.raw?.vendor_hints || []).length
      ? `<details class="vendor-hints"><summary>Vendor-specific tips</summary><ul>${
        d.raw.vendor_hints.map(h => `<li>${esc(h)}</li>`).join("")
      }</ul></details>` : ""}
    ${ready && method ? `<div class="actions" style="margin-top:10px">
      <button type="button" class="btn sm primary extract-rec">Extract (${esc(method)}) →</button>
    </div>` : ""}

function wireDevicePanel(r, p) {
  p.querySelectorAll(".card.pick").forEach(card => {
    card.onclick = () => {
      const d = r.devices[+card.dataset.i];
      if (d.raw && d.raw.ready === false) return;
      S.device = d;
      S.preferredMethod = d.raw?.recommended_method || (d.transport === "mtp" ? "mtp" : "");
      p.querySelectorAll(".card").forEach(c => c.classList.remove("sel"));
      card.classList.add("sel");
      $("#dQ").value = d.name || d.model;
      searchManual($("#dQ").value);
    };
  });
  p.querySelectorAll(".card.pick").forEach(card => {
    const recBtn = card.querySelector(".extract-rec");
    if (recBtn) {
      recBtn.onclick = (e) => {
        e.stopPropagation();
        const d = r.devices[+card.dataset.i];
        S.device = d;
        S.preferredMethod = d.raw?.recommended_method
          || (d.transport === "mtp" ? "mtp" : "comprehensive");
        S.view = "extract";
        renderNav();
        route();
      };
    }
  });
  p.querySelectorAll(".batch-cb").forEach(cb => {
    cb.onchange = () => {
      const serial = cb.dataset.serial;
      if (cb.checked) {
        if (!S.batchSelected.includes(serial)) S.batchSelected.push(serial);
      } else {
        S.batchSelected = S.batchSelected.filter(s => s !== serial);
      }
      syncBatchButtons();
    };
  });
  syncBatchButtons();
  if ($("#devAgain")) $("#devAgain").onclick = () => refreshDevices({ deep: true });
  if ($("#devWhy")) $("#devWhy").onclick = runDeviceDiagnose;
}

async function runDeviceDiagnose() {
  const host = $("#devDiag");
  if (!host) return;
  host.innerHTML = `<div class="note">Running diagnostics…</div>`;
  try {
    const d = await api("diagnose");
    let html = `<div class="note"><b>Diagnosis</b>`;
    if (d.devices && d.devices.length) {
      html += `<table class="tbl"><tr><th>Serial</th><th>State</th>`
            + `<th>Model</th><th>What it means</th></tr>`;
      d.devices.forEach(x => {
        html += `<tr><td>${esc(x.serial)}</td><td><b>${esc(x.state)}</b>`
              + `</td><td>${esc(x.model || "—")}</td>`
              + `<td>${esc(x.meaning)}</td></tr>`;
      });
      html += `</table>`;
    }
    (d.problems || []).forEach(pr => {
      html += `<div style="margin-top:8px"><b>${esc(pr.issue)}</b><br>`
            + `<span style="color:var(--fg2)">→ ${esc(pr.fix)}</span></div>`;
    });
    if ((d.vendor_guidance || []).length) {
      html += `<div style="margin-top:10px"><b>Vendor-specific</b><ul>`;
      d.vendor_guidance.forEach(g => { html += `<li>${esc(g)}</li>`; });
      html += `</ul></div>`;
    }
    (d.next_steps || []).forEach(s => {
      html += `<div style="margin-top:6px">→ ${esc(s)}</div>`;
    });
    html += `</div>`;
    host.innerHTML = html;
  } catch (e) {
    host.innerHTML = `<div class="note warn">${esc(e.message || String(e))}</div>`;
  }
}

async function refreshDevices(opts = {}) {
  const { deep = true, refreshAdb = false, quiet = false } = opts;
  const p = $("#devPanel");
  if (!p) return;
  const bar = $("#devScanBar");
  if (bar && !quiet) {
    bar.style.display = "";
    bar.innerHTML = `<span class="spin"></span> Scanning…`;
  }
  if (!quiet) {
    p.innerHTML = `<div class="empty" style="padding:24px"><span class="spin"></span>`
      + ` <span style="margin-left:8px;color:var(--fg2)">`
      + `${deep ? "Deep" : "Quick"} scan in progress…</span></div>`;
  }
  try {
    const qs = [];
    if (!deep) qs.push("deep=0");
    if (refreshAdb) qs.push("refresh_adb=1");
    const r = await api("devices" + (qs.length ? "?" + qs.join("&") : ""));
    renderScanBar(r.scan);
    S.lastScanAt = Date.now();
    if (bar) {
      if (S.autoScanOn) {
        bar.style.display = "";
        bar.innerHTML = `<span class="dot" style="color:var(--ok)"></span> Live · updated ${relativeTime(new Date(S.lastScanAt).toISOString())}`;
      } else if (!quiet) {
        bar.innerHTML = `Scanned ${relativeTime(new Date(S.lastScanAt).toISOString())}`;
      }
    }
    if (!r.devices.length) {
      p.innerHTML = `<div class="note warn"><b>No device detected</b>
        ${(r.diagnostics || []).map(esc).join("<br>") ||
          `Nothing responded on USB. You can still work from an existing
           extraction — choose <b>Import</b> on the next step.`}</div>
        <button class="btn sm" id="devAgain">Scan again</button>
        <button class="btn sm" id="devWhy">Why not?</button>
        <div id="devDiag"></div>`;
      syncBatchButtons();
    } else {
      const ready = r.devices.filter(d => d.raw?.ready !== false);
      const blocked = r.devices.filter(d => d.raw?.ready === false);
      S.connectedDevices = r.devices;
      if (!S.device && ready.length) {
        S.device = ready.find(d => d.transport === "mtp") || ready[0];
      }
      const scanNote = r.scan
        ? `<div class="note">${r.count} handset(s) — ${r.ready_count ?? ready.length} ready`
          + `, ${r.blocked_count ?? blocked.length} blocked`
          + (r.scan.merged_from > r.count
            ? ` · unified from ${r.scan.merged_from} transport views` : "")
          + ` · ${r.scan.elapsed_ms}ms</div>`
        : "";
      const summary = r.devices.length > 1
        ? scanNote + `<div class="note">Tick devices for batch intake, or select one to examine.</div>`
        : scanNote;
      p.innerHTML = summary + `<div class="cards">${
        r.devices.map((d, i) => deviceCardHtml(d, i)).join("")
      }</div>
        <button class="btn sm" id="devAgain" style="margin-top:12px">Scan again</button>
        <button class="btn sm" id="devWhy" style="margin-top:12px">Why not?</button>
        <div id="devDiag"></div>`;
      wireDevicePanel(r, p);
    }
    if ($("#devAgain")) $("#devAgain").onclick = () => refreshDevices({ deep: true });
    if ($("#devWhy")) $("#devWhy").onclick = runDeviceDiagnose;

    // Quick scan first, then deep-enrich ready adb devices in the background.
    if (!deep && !quiet && r.devices.some(d =>
        d.transport === "adb" && d.raw?.ready && !d.raw?.deep_scan)) {
      setTimeout(() => refreshDevices({ deep: true, quiet: true }), 80);
    }
  } catch (e) {
    if (bar) bar.style.display = "none";
    p.innerHTML = `<div class="note warn">Scan failed: ${esc(e.message || String(e))}</div>
      <button class="btn sm" id="devAgain">Retry</button>`;
    if ($("#devAgain")) $("#devAgain").onclick = () => refreshDevices({ deep: true });
  }
}

async function searchManual(q) {
  const res = $("#dResults"), mx = $("#dMatrix");
  if (!q.trim()) return;
  res.innerHTML = `<span class="spin"></span>`; mx.innerHTML = "";
  try {
    const r = await api("manual/search?q=" + encodeURIComponent(q));
    if (!r.results.length) {
      res.innerHTML = `<div class="note warn"><b>Not in the device manual</b>
        This model is not listed. Manual §7 precaution 1 says not to attempt
        extraction on an unverified device. You can still use <b>Import</b> to
        analyse an extraction taken elsewhere.</div>`;
      return;
    }
    res.innerHTML = `<div class="cards">${r.results.slice(0, 6).map((p, i) => `
      <div class="card pick" data-name="${esc(p.name)}">
        <h3>${esc(p.name)}</h3>
        <dl class="kv">
          <dt>OS</dt><dd>${esc(p.os_family)} ${esc(p.os_versions)}</dd>
          <dt>Chipset</dt><dd>${esc(p.chipset || "—")}</dd>
          <dt>Released</dt><dd>${esc(p.released || "—")}</dd>
          <dt>Connector</dt><dd>${esc(p.connector || "—")}</dd>

}
