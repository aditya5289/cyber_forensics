[package]
name = "argus-forensics"
version = "1.1.0"
description = "ARGUS Forensics — Windows desktop shell"
authors = ["ARGUS Forensics"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "argus_forensics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
