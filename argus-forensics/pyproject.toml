[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-forensics"
version = "1.2.0"
description = "Mobile device forensic acquisition and analysis toolkit (XRY/XAMN-equivalent workflow)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARGUS Forensics" }]
keywords = ["forensics", "mobile", "android", "ios", "dfir", "sqlite", "carving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Recovery Tools",
]

# The core toolkit — acquisition, carving, analysis, HTML/XML/JSON/CSV
# reporting and the web UI — runs on the standard library alone. This is
# deliberate: a forensic workstation is often air-gapped, and a tool that
# cannot open evidence without a package index is a tool that cannot be used.
dependencies = []

[project.optional-dependencies]
media  = ["pillow>=10.0"]                 # EXIF/GPS extraction from images
office = ["openpyxl>=3.1", "python-docx>=1.1", "reportlab>=4.0"]  # XLSX/DOCX/PDF
crypto = ["pycryptodome>=3.19"]           # encrypted Android backups
all    = ["pillow>=10.0", "openpyxl>=3.1", "python-docx>=1.1",
          "reportlab>=4.0", "pycryptodome>=3.19"]
dev    = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
argus = "argus.cli:main"

[project.urls]
Documentation = "https://github.com/example/argus-forensics#readme"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
argus = ["ui/*.html", "devices/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
